<!-- Android adaptive icon foreground: the bullseye a, white with an amber centre, on
     transparent. The logo's 48-unit square fills the central 72dp of the 108dp canvas, so the
     mark stays inside the 66dp safe zone under any launcher mask. Also the monochrome (themed)
     icon, which takes only its shape. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-12 -12 72 72">
  <g fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" transform="translate(24 24) scale(1.12) translate(-23.65 -24.15)">
    <circle cx="22.5" cy="24.4" r="9.4"/>
    <path d="M34.2 13.9v20.5"/>
    <circle cx="22.5" cy="24.4" r="3.4" fill="#F6B740" stroke="none"/>
  </g>
</svg>
