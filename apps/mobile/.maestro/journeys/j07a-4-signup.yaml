# J07A step 4: no place for the code; Elena does what Ines said first, "install Aimtrue": she scrolls
# back up and taps "Sign up free".
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: guest-band-signup
    direction: UP
    timeout: 20000
- tapOn:
    id: guest-band-signup
- extendedWaitUntil:
    visible:
      id: signup-sheet
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
