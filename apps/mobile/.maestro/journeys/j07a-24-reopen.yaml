# J07A step 24: later, after Ines let her in (Elena was not told), Elena opens the app again. Nothing is cleared.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true
- runFlow:
    when:
      true: ${APP_ID.endsWith('.dev')}
    file: ../subflows/dev-client-load.yaml
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
