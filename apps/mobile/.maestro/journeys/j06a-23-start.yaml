# J06A step 23: Pat taps "Start the space". Expected: the new space opens on "Invite people".
appId: ${APP_ID}
---
- tapOn:
    id: welcome-make-submit
- extendedWaitUntil:
    visible:
      id: screen-onboarding-invite
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
