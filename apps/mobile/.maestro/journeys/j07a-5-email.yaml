# J07A step 5: Elena types her address and taps Continue (developer sign-up: sign-in is off locally).
appId: ${APP_ID}
---
- tapOn:
    id: signup-sheet-email
- inputText: 'elena.ruiz@example.com'
- tapOn:
    id: signup-sheet-continue
- extendedWaitUntil:
    visible:
      id: screen-sign-up
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
