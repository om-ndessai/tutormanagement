# J04A step 9: "a day later" Ava opens the app again. Nothing is cleared.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true
- runFlow:
    when:
      true: ${APP_ID.endsWith('.dev')}
    file: ../subflows/dev-client-load.yaml
- extendedWaitUntil:
    visible:
      id: screen-guest-home
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
