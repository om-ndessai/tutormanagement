# J01A steps 21-22: Morgan taps "10 in a row" (Grade 8; locked as a guest). The countdown, then question 1.
appId: ${APP_ID}
---
- tapOn:
    id: play-tile-G8Q10
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: game-countdown
    timeout: 8000
    optional: true
- takeScreenshot: j01a-countdown
- extendedWaitUntil:
    visible:
      id: game-question-number
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
