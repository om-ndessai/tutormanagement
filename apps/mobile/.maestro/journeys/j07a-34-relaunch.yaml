# J07A step 34 (end-state check): Elena closes the app and opens it again later. Nothing is cleared.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true
- runFlow:
    when:
      true: ${APP_ID.endsWith('.dev')}
    file: ../subflows/dev-client-load.yaml
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
