# Sofia, the student, reads her schedule and its dates but has no capacity to cancel (cancel_as is
# null): no Cancel on any date, no "Cancel another date", no Restore on the seeded cancellation, and
# none of the editor's controls.
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: sofia.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'Schedule'
- extendedWaitUntil:
    visible:
      id: schedule-dates-toggle-70000000-0000-4000-8000-000000000001
    timeout: 20000
- assertNotVisible:
    id: schedule-add-button
- assertNotVisible:
    id: schedule-edit-70000000-0000-4000-8000-000000000001
- assertNotVisible:
    id: schedule-remove-70000000-0000-4000-8000-000000000001
- assertVisible:
    id: schedule-calendar-70000000-0000-4000-8000-000000000001
- tapOn:
    id: schedule-dates-toggle-70000000-0000-4000-8000-000000000001
- extendedWaitUntil:
    visible:
      id: 'schedule-date-70000000-0000-4000-8000-000000000001-.*'
      index: 0
    timeout: 15000
- assertNotVisible:
    id: 'schedule-cancel-70000000-0000-4000-8000-000000000001-.*'
- assertNotVisible:
    id: schedule-cancel-other-70000000-0000-4000-8000-000000000001
- takeScreenshot: schedule-student-dates
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: tutorportal://schedule?focus=70000000-0000-4000-8000-000000000001&on=2026-11-24
- extendedWaitUntil:
    visible:
      id: focus-notice
    timeout: 15000
- scrollUntilVisible:
    element:
      id: schedule-cancelled-70000000-0000-4000-8000-000000000001-2026-11-24
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: schedule-restore-70000000-0000-4000-8000-000000000001-2026-11-24
- assertNotVisible:
    id: 'schedule-cancel-70000000-0000-4000-8000-000000000001-.*'
