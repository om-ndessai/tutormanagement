# Developer sign-in: the screen lists seeded people, a person lands where they belong, an
# unknown email is refused by the server, and signing out returns to sign-in.
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 30000
- assertVisible: 'Aimtrue'
- assertVisible: 'Developer sign-in'
# Someone the server does not know is refused, in its words.
- scrollUntilVisible:
    element:
      id: sign-in-email
- tapOn:
    id: sign-in-email
- inputText: 'nobody@example.com'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: sign-in-error
    timeout: 15000
- assertVisible:
    id: screen-sign-in
# A student with one organization goes straight in.
- scrollUntilVisible:
    element:
      id: sign-in-persona-sofia.okafor@gmail.com
    direction: UP
- tapOn:
    id: sign-in-persona-sofia.okafor@gmail.com
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
# Home greets her by name on the organization's clock (UI upgrades U6).
- assertVisible:
    id: home-greeting
    text: 'Good (morning|afternoon|evening), Sofia'
# Signing out is in the account sheet (the shell, 12).
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
# The build's phase, in small text (owner, 2026-10-24).
- scrollUntilVisible:
    element:
      id: release-phase
- assertVisible:
    id: release-phase
    text: 'Phase \d+'
- scrollUntilVisible:
    element:
      id: account-sign-out
    direction: UP
- tapOn:
    id: account-sign-out
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 15000
- scrollUntilVisible:
    element:
      id: release-phase
- assertVisible:
    id: release-phase
    text: 'Phase \d+'
