# The office's Billing (Priya): the three headline tiles, the tutor and family ledgers, the payment
# log, the CSV and tax-summary buttons. She records $123.45 from Anita Patel for Sanjay (his only
# child, so chosen for her), sees it top the log and Sanjay's balance fall from $80.00 to -$43.45,
# corrects it to $120.00, then deletes it. Changes data: reset the database afterwards.
appId: ${APP_ID}
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: tutorportal://billing
- extendedWaitUntil:
    visible:
      id: billing-record
    timeout: 20000
- assertVisible: 'No money moves through the portal. This tracks what is owed and what has been paid.'
- assertVisible:
    id: billing-export
- assertVisible:
    id: billing-tax-summary
- extendedWaitUntil:
    visible:
      id: stat-owed-to-tutors
    timeout: 20000
- assertVisible: 'Owed by families'
- assertVisible: 'Top-ups due'
- assertVisible:
    id: stat-owed-to-tutors-value
    text: '\$.*'
- takeScreenshot: billing-admin-top
- scrollUntilVisible:
    element:
      id: billing-tutor-00000000-0000-4000-8000-000000000003
    direction: DOWN
    timeout: 20000
- assertVisible: 'Tutors'
- scrollUntilVisible:
    element: 'Families'
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: billing-families-more
    direction: DOWN
    timeout: 30000
- tapOn:
    id: billing-families-more
- scrollUntilVisible:
    element:
      id: billing-family-balance-00000000-0000-4000-8000-000000000006
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: billing-family-balance-00000000-0000-4000-8000-000000000006
    text: '\$80\.00'
- scrollUntilVisible:
    element: 'Payments'
    direction: DOWN
    timeout: 60000
- takeScreenshot: billing-admin-log
# Record a payment from Anita for Sanjay.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: tutorportal://payment-form
- extendedWaitUntil:
    visible:
      id: payment-party-search
    timeout: 20000
- assertVisible: 'Record a payment'
- tapOn:
    id: payment-party-search
- inputText: 'Anita'
# The Search key puts the keyboard away, uncovering the matches.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: payment-party-00000000-0000-4000-8000-000000000007
    timeout: 10000
- tapOn:
    id: payment-party-00000000-0000-4000-8000-000000000007
# Her only child is chosen for her.
- extendedWaitUntil:
    visible: 'Sanjay Patel'
    timeout: 10000
- tapOn:
    id: payment-amount
- inputText: '123.45'
- pressKey: Enter
- tapOn:
    id: payment-method-cash
- takeScreenshot: billing-admin-form
- scrollUntilVisible:
    element:
      id: payment-save
    direction: DOWN
    timeout: 20000
- tapOn:
    id: payment-save
- extendedWaitUntil:
    visible: 'Payment recorded.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: screen-billing
    timeout: 10000
- scrollUntilVisible:
    element:
      id: billing-family-balance-00000000-0000-4000-8000-000000000006
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: billing-family-balance-00000000-0000-4000-8000-000000000006
      text: '-\$43\.45'
    timeout: 15000
# The newest payment heads the log.
- scrollUntilVisible:
    element: '\$123\.45'
    direction: DOWN
    timeout: 60000
- tapOn:
    text: 'Edit the payment involving Anita Patel'
    index: 0
- extendedWaitUntil:
    visible: 'Edit payment'
    timeout: 15000
- assertVisible: '123.45'
- tapOn:
    id: payment-amount
- eraseText: 10
- tapOn:
    id: payment-amount
- eraseText: 10
- inputText: '120'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: payment-save
    direction: DOWN
    timeout: 20000
- tapOn:
    id: payment-save
- extendedWaitUntil:
    visible: 'Payment updated.'
    timeout: 15000
- scrollUntilVisible:
    element: '\$120\.00'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: 'Delete the payment involving Anita Patel'
    index: 0
- extendedWaitUntil:
    visible: 'Delete this payment\?'
    timeout: 10000
- assertVisible: 'The \$120\.00 record involving Anita Patel.*'
- tapOn: 'Delete'
- extendedWaitUntil:
    visible: 'Payment deleted.'
    timeout: 15000
- extendedWaitUntil:
    notVisible: '\$120\.00'
    timeout: 10000
