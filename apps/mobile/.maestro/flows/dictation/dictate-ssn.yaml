# A dictated Social Security number never reaches the write-up (P3). Alex dictates a phrase holding
# an SSN into the notes: the words being heard are masked by the warning, the settled phrase is
# refused with the shared sentence under the field, dictation stops, nothing autosaves, and closing
# leaves no draft.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/clean-sessions.js
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://dev/dictate?permission=granted&hold=10000&text=her%20number%20is%20123-45-6789'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
- tapOn: 'Sessions'
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 20000
# Record a lesson is a step flow (UI upgrades U4): Ben, the times as they are, then Planned.
- runFlow:
    file: ../../subflows/record-lesson-start.yaml
    env:
      PAIRING: a0000000-0000-4000-8000-000000000002
# The notes are the Covered card's.
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*What was covered\?.*'
    timeout: 10000
- tapOn:
    id: dictate-record-notes
- extendedWaitUntil:
    visible:
      id: dictation-interim-record-notes
    timeout: 10000
# The words being heard hold an SSN: the warning shows instead of them. The scripted recognizer
# holds its first half ("her number") for 10 s before the phrase; the mic icon's pulse used to delay
# this wait by a few seconds, the large Dictate button (UI upgrades U4) does not, so it allows 20.
- extendedWaitUntil:
    visible: '.*looks like a Social Security number.*'
    timeout: 20000
- assertNotVisible: '.*123-45-6789.*'
- takeScreenshot: dictation-ssn-interim
# The settled phrase is refused, under the field, and dictation stops.
- extendedWaitUntil:
    visible:
      id: dictation-error-record-notes
      text: '.*looks like a Social Security number.*'
    timeout: 25000
- extendedWaitUntil:
    notVisible:
      id: dictation-interim-record-notes
    timeout: 10000
- assertNotVisible: '.*123-45-6789.*'
- takeScreenshot: dictation-refused
# The autosave status is in the flow's footer, on every card.
- assertNotVisible:
    id: record-autosave-status
    text: 'Draft autosaved .*'
- tapOn:
    id: step-flow-close
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
- assertNotVisible: '.*kept as a draft.*'
- assertNotVisible:
    id: drafts-panel
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://dev/dictate?reset=1'
