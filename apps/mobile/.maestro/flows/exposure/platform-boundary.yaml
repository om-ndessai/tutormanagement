# The platform console's boundary (R14). Nav, a platform admin in no organization: the console's
# tabs are organizations, the question bank, admins, people (look-up by email) and its own activity --
# no Sessions, Schedule, Progress or Billing. Its organization list and an organization's page show
# the organization and its admins (Priya), never its students, tutors, lessons or money; the question
# bank (#54: the tab, a standard, Review) is reference data with none of them either. A link into an
# organization's lessons or a person's record leaves him on the console. Priya, an organization's
# admin, is offered no way into the console, not even from Search.
appId: ${APP_ID}
tags:
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: ndessai@gmail.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: platform-org-chmi
    timeout: 30000
- assertNotVisible: 'Sessions'
- assertNotVisible: 'Schedule'
- assertNotVisible: 'Progress'
- assertNotVisible: 'Billing'
- runFlow: ../../subflows/exposure/no-org-records.yaml
- takeScreenshot: exposure-console-list
# An organization's page: its admins, and nothing of its people's work.
- tapOn:
    id: platform-org-chmi
- extendedWaitUntil:
    visible:
      id: screen-platform-organization
    timeout: 15000
- runFlow: ../../subflows/exposure/no-org-records.yaml
- scrollUntilVisible:
    element:
      id: platform-org-admin-00000000-0000-4000-8000-000000000001
    direction: DOWN
    timeout: 20000
- assertVisible: '.*Priya Raghavan.*'
- runFlow: ../../subflows/exposure/no-org-records.yaml
- repeat:
    times: 2
    commands:
      - scroll
      - runFlow: ../../subflows/exposure/no-org-records.yaml
- takeScreenshot: exposure-console-org
# Links into an organization's data: no organization, so none of it.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://sessions?focus=50000000-0000-4000-8000-000000000002
- extendedWaitUntil:
    visible:
      id: 'screen-platform.*'
    timeout: 20000
- assertNotVisible:
    id: screen-sessions
- runFlow: ../../subflows/exposure/no-org-records.yaml
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://people/00000000-0000-4000-8000-000000000008
- extendedWaitUntil:
    visible:
      id: 'screen-platform.*'
    timeout: 20000
- assertNotVisible:
    id: screen-person
- runFlow: ../../subflows/exposure/no-org-records.yaml
- takeScreenshot: exposure-console-links
# The question bank (#54): platform reference data -- no person, lesson or money of any
# organization on its tab, a standard's questions or Review.
- tapOn: 'Questions'
- extendedWaitUntil:
    visible:
      id: question-bank-review
    timeout: 20000
- runFlow: ../../subflows/exposure/no-org-records.yaml
- tapOn:
    id: question-bank-level-NC26.4
- scrollUntilVisible:
    element:
      id: question-bank-standard-NC26.4.ANR.1
    centerElement: true
- runFlow: ../../subflows/exposure/no-org-records.yaml
- tapOn:
    id: question-bank-standard-NC26.4.ANR.1
- extendedWaitUntil:
    visible:
      id: 'question-bank-card-.*'
    timeout: 20000
- runFlow: ../../subflows/exposure/no-org-records.yaml
- scroll
- runFlow: ../../subflows/exposure/no-org-records.yaml
- runFlow: ../../subflows/go-back.yaml
- scrollUntilVisible:
    element:
      id: question-bank-review
    direction: UP
- tapOn:
    id: question-bank-review
- extendedWaitUntil:
    visible:
      id: 'question-bank-card-.*'
    timeout: 20000
- runFlow: ../../subflows/exposure/no-org-records.yaml
- assertNotVisible: 'Sessions'
- assertNotVisible: 'Billing'
- runFlow: ../../subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: screen-platform-questions
    timeout: 15000
# The console's own log: no money.
- tapOn: 'Activity'
- extendedWaitUntil:
    visible:
      id: screen-platform-activity
    timeout: 15000
- assertNotVisible: '.*\$[0-9].*'
# Priya, an organization's admin: a link to the console leaves her on Home, and Search offers none.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://platform
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertNotVisible:
    id: 'screen-platform.*'
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 15000
- tapOn:
    id: search-input
- inputText: platform
- extendedWaitUntil:
    visible:
      id: search-empty
    timeout: 15000
- assertNotVisible:
    id: search-action-platform
- assertNotVisible: 'Platform console'
