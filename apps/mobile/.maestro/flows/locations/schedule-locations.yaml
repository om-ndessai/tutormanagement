# A schedule's places (Phase 33). Priya schedules Sanjay with herself: choosing the pairing fills
# the in-person place with her own "Institute, room 2" and leaves online at None. Choosing None for
# both and saving is refused under the pickers ("Choose at least one location."), nothing saved.
# She picks her online room alone, saves, and the week strip's Monday card names it; she removes
# the schedule. Cleans up after itself.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/clean-schedules.js
onFlowComplete:
  - runScript: ../../scripts/clean-schedules.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'Schedule'
- extendedWaitUntil:
    visible:
      id: schedule-add-button
    timeout: 20000
- tapOn:
    id: schedule-add-button
- extendedWaitUntil:
    visible:
      id: schedule-pairing-search
    timeout: 15000
- tapOn:
    id: schedule-pairing-search
- inputText: 'Sanjay'
# Wait for the list to narrow before tapping, or the tap lands where a row used to be.
- extendedWaitUntil:
    notVisible: 'Showing 8 of .*'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: schedule-pairing-a0000000-0000-4000-8000-000000000004
    timeout: 10000
- tapOn:
    id: schedule-pairing-a0000000-0000-4000-8000-000000000004
- assertVisible: 'Student: Sanjay Patel\. Change'
- tapOn:
    id: schedule-form-day-1
# The default: the tutor's own in-person place, no online room.
- scrollUntilVisible:
    element:
      id: schedule-location-virtual
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: schedule-location-physical
    text: 'In person: Institute, room 2\. Change'
- assertVisible:
    id: schedule-location-virtual
    text: 'Online: None\. Change'
- assertVisible:
    id: schedule-locations-hint
- takeScreenshot: locations-schedule-default
# None for both is refused.
- tapOn:
    id: schedule-location-physical
- extendedWaitUntil:
    visible:
      id: schedule-location-physical-none
    timeout: 5000
- assertVisible:
    id: schedule-location-physical-0c100000-0000-4000-8000-000000000007
- tapOn:
    id: schedule-location-physical-none
- assertVisible:
    id: schedule-location-physical
    text: 'In person: None\. Change'
- scrollUntilVisible:
    element:
      id: schedule-form-save
    direction: DOWN
    timeout: 10000
- tapOn:
    id: schedule-form-save
- scrollUntilVisible:
    element: 'Choose at least one location\.'
    direction: UP
    timeout: 10000
- assertNotVisible:
    id: schedule-locations-hint
- assertNotVisible: 'Session scheduled\.'
- takeScreenshot: locations-schedule-none
# Online alone will do.
- tapOn:
    id: schedule-location-virtual
- extendedWaitUntil:
    visible:
      id: schedule-location-virtual-0c100000-0000-4000-8000-000000000008
    timeout: 5000
- tapOn:
    id: schedule-location-virtual-0c100000-0000-4000-8000-000000000008
- assertVisible:
    id: schedule-location-virtual
    text: 'Online: Online room\. Change'
- scrollUntilVisible:
    element:
      id: schedule-form-save
    direction: DOWN
    timeout: 10000
- tapOn:
    id: schedule-form-save
- extendedWaitUntil:
    visible: 'Session scheduled\.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: schedule-day-1
    timeout: 10000
- tapOn:
    id: schedule-day-1
- extendedWaitUntil:
    visible: "Remove Sanjay Patel's Mondays 4:00.*"
    timeout: 10000
- assertVisible: 'Online: Online room'
- takeScreenshot: locations-schedule-card
- tapOn: "Remove Sanjay Patel's Mondays 4:00.*"
- extendedWaitUntil:
    visible: 'Remove this recurring session\?'
    timeout: 10000
- tapOn: 'Remove'
- extendedWaitUntil:
    visible: 'Schedule removed\.'
    timeout: 15000
- assertNotVisible: "Remove Sanjay Patel's Mondays 4:00.*"
