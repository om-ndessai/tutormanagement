# A schedule's places (Phase 33), in Schedule a lesson's Where step (UI upgrades U5). Priya schedules
# Sanjay with herself: choosing the pairing chooses her own "Institute, room 2". Taking it off leaves
# no place, and Next is refused ("Choose at least one location."). She picks her online room alone:
# the Review says "online in Online room", she schedules, and the week strip's Monday card names it;
# she removes the schedule. Cleans up after itself.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/clean-schedules.js
onFlowComplete:
  - runScript: ../../scripts/clean-schedules.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow: ../../subflows/open-schedule.yaml
- extendedWaitUntil:
    visible:
      id: schedule-add-button
    timeout: 20000
- tapOn:
    id: schedule-add-button
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who is the lesson with\?.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: schedule-pairing-input
- inputText: 'Sanjay'
- extendedWaitUntil:
    visible:
      id: schedule-pairing-row-a0000000-0000-4000-8000-000000000004
    timeout: 10000
- tapOn:
    id: schedule-pairing-row-a0000000-0000-4000-8000-000000000004
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: schedule-form-day-1
    timeout: 10000
- tapOn:
    id: schedule-form-day-1
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*From when\?.*'
    timeout: 10000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Where is it\?.*'
    timeout: 10000
# The default: the tutor's own in-person place; her online room offered beside it.
- assertVisible:
    id: schedule-place-0c100000-0000-4000-8000-000000000007
- assertVisible:
    id: schedule-place-0c100000-0000-4000-8000-000000000008
- assertVisible:
    id: schedule-locations-hint
- takeScreenshot: locations-schedule-default
# Taken off, there is no place, and Next is refused.
- tapOn:
    id: schedule-place-0c100000-0000-4000-8000-000000000007
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible: 'Choose at least one location\.'
    timeout: 5000
- assertNotVisible:
    id: schedule-locations-hint
- assertVisible:
    id: step-flow-title
    text: '.*Where is it\?.*'
- takeScreenshot: locations-schedule-none
# Online alone will do.
- tapOn:
    id: schedule-place-0c100000-0000-4000-8000-000000000008
- assertNotVisible: 'Choose at least one location\.'
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: schedule-review-sentence
      text: 'Every Monday, 4:00–5:00 PM, online in Online room, starting .*'
    timeout: 10000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible: 'Session scheduled\.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: schedule-day-1
    timeout: 10000
- tapOn:
    id: schedule-day-1
- extendedWaitUntil:
    visible: "Remove Sanjay Patel's Mondays 4:00.*"
    timeout: 10000
- assertVisible: 'Online: Online room'
- takeScreenshot: locations-schedule-card
- tapOn: "Remove Sanjay Patel's Mondays 4:00.*"
- extendedWaitUntil:
    visible: 'Remove this recurring session\?'
    timeout: 10000
- tapOn: 'Remove'
- extendedWaitUntil:
    visible: 'Schedule removed\.'
    timeout: 15000
- assertNotVisible: "Remove Sanjay Patel's Mondays 4:00.*"
