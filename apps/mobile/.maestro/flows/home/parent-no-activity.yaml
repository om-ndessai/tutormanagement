# Phase 43 (the owner, 2026-10-20): Recent Activity is on no one's Home. A parent's Home (Anita) shows
# her children and no Recent Activity; since Phase 66 her dashboard (balances, lessons, payments) is
# More → Dashboard, also without Recent Activity. The Activity page stays.
appId: ${APP_ID}
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: anita.patel.nc@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
# Phase 66: her Home is the member home -- her children, no Recent Activity, no money.
- assertNotVisible:
    id: home-now
- scrollUntilVisible:
    element:
      id: home-section-parent
    visibilityPercentage: 1
- scroll
- assertNotVisible:
    id: dashboard-section-recent-activity
- assertNotVisible: 'Recent Activity'
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: home-parent-bottom
# More has the Dashboard (since Phase 66, for every role where Tutoring is on) and Activity.
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- assertVisible:
    id: more-nav-analytics
- assertVisible:
    id: more-nav-activity
# Her dashboard: balances, payments -- and still no Recent Activity.
- tapOn:
    id: more-nav-analytics
- extendedWaitUntil:
    visible:
      id: dashboard-parent
    timeout: 20000
- scrollUntilVisible:
    element:
      id: parent-payments-action
    direction: DOWN
- scroll
- assertNotVisible:
    id: dashboard-section-recent-activity
