# Phase 43 (the owner, 2026-10-20) and Phase 66: the dashboards left Home for the Dashboard page under More, and
# Recent Activity left every Home (the Activity page stays under More). Priya (admin and tutor in
# chmi): Home has neither; More → Dashboard is the whole dashboard (since 2026-10-28), the office's or, by its Tutor chip, her own teaching's; Search
# finds the page too.
appId: ${APP_ID}
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
# Phase 66: Home is the member home -- no figures, no Recent Activity, no Tutoring/Finance tabs.
- assertNotVisible:
    id: stat-students
- assertNotVisible:
    id: tabs-tutoring
- scrollUntilVisible:
    element:
      id: home-section-office
    visibilityPercentage: 1
- scroll
- scroll
- assertNotVisible:
    id: dashboard-section-recent-activity
- takeScreenshot: home-admin-bottom
# More → Dashboard.
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- assertVisible:
    id: more-nav-analytics
- assertVisible:
    id: more-nav-activity
- tapOn:
    id: more-nav-analytics
- extendedWaitUntil:
    visible:
      id: screen-dashboard-analytics
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: stat-students
    timeout: 20000
- assertVisible:
    id: stat-tutors
- assertVisible:
    id: stat-parents
- assertVisible:
    id: stat-sessions-running
- assertVisible:
    id: dashboard-section-analytics
- assertVisible:
    id: dashboard-section-tutoring-sessions
- scrollUntilVisible:
    element:
      id: dashboard-section-recent-activity
    direction: DOWN
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: dashboard-analytics-admin
# Her own teaching: the Tutor chip, as the web's role picker.
- scrollUntilVisible:
    element:
      id: dashboard-role-tutor
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: dashboard-role-tutor
- extendedWaitUntil:
    visible:
      id: stat-sessions
    timeout: 20000
- assertNotVisible:
    id: stat-tutors
- runFlow: ../../subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
# Search finds it as Dashboard; Home is Home.
- tapOn:
    id: more-search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 10000
- tapOn:
    id: search-input
- inputText: 'analytics'
- extendedWaitUntil:
    visible:
      id: search-goto-nav-analytics
    timeout: 5000
- assertVisible:
    id: search-goto-nav-analytics
    text: 'Dashboard'
- tapOn:
    id: search-goto-nav-analytics
- extendedWaitUntil:
    visible:
      id: screen-dashboard-analytics
    timeout: 10000
