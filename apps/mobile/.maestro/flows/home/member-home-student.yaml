# Phase 66 (H3): Sofia, a student in chmi. Her Home is "Your learning": Next up and her section name her
# next lesson with Alex, in words. Phase 74 (JF17): and where -- the place of her schedule, by name ("… with Alex ·
# Institute, room 2", or his online room); the band never repeats the lesson Next up shows (JF23); her menu has no
# Users (JF31).
appId: ${APP_ID}
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: sofia.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
- assertVisible:
    id: home-greeting
    text: 'Good (morning|afternoon|evening), Sofia'
- assertVisible:
    id: home-strip
    text: '(Next lesson: .* with Alex · .+|.*in a row|Start a streak.*|Ready when you are)'
- assertVisible:
    id: next-up
# The lesson is named once: by Next up when it leads (then the section leaves its own card out), else by
# her section's "Your next lesson" card.
# (The notVisible branch goes first: it scrolls, and runs only where Next up is something else.)
- runFlow:
    when:
      notVisible:
        id: next-up-learner_lesson
    commands:
      - scrollUntilVisible:
          element:
            id: home-section-learner
          visibilityPercentage: 1
      - scrollUntilVisible:
          element:
            id: home-learner-next
          centerElement: true
      - assertVisible:
          id: home-learner-next
          text: '.*with Alex · (Institute, room 2|Online room)'
- runFlow:
    when:
      visible:
        id: next-up-learner_lesson
    commands:
      - assertVisible:
          id: next-up-title
          text: '.*with Alex · (Institute, room 2|Online room)\.'
      - assertNotVisible:
          id: home-strip
          text: 'Next lesson: .*'
      - scrollUntilVisible:
          element:
            id: home-section-learner
          visibilityPercentage: 1
      - assertVisible: 'Your learning'
      - assertNotVisible:
          id: home-learner-next
- assertNotVisible:
    id: home-section-tutor
- assertNotVisible:
    id: home-section-parent
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: member-home-student
# Phase 74 (JF31): a student's menu has no Users (nor Pairings or Billing); links to those pages still open.
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- scrollUntilVisible:
    element:
      id: more-nav-analytics
    centerElement: true
- assertNotVisible:
    id: more-nav-users
- assertNotVisible:
    id: more-nav-assignments
- assertNotVisible:
    id: more-nav-billing
