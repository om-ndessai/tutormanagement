# Quest Games (Phase 46; the wizard, Phase 47), starting one. Anita, a parent, finds Quest under More
# (chmi's switch on, through the local API): her Quest page is the Games panel alone -- no Your Quest, no
# review. Start a game, the five-step wizard: G6's tile with its count; Length: 99 typed is held to 50,
# then 2; Scoring: a wrong answer −1; Players: teams of 2; the Review in words and "Generate game code".
# The lobby: its status label, a six-character code of the readable alphabet, the rules in words, nobody
# yet, and Start the Quest waits for a player. Alex joins with that code (through the API, as a second
# device would) and arrives by the poll. Start the Quest: the doors count down, then Anita hosts without
# playing. Alex skips both questions: the results, "Alex wins!". Exit: the Quest page, the game listed as
# finished. The switches are off again at the end, whatever happens.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/quest-games-end.js
  - runScript: ../../scripts/quest-games-start.js
onFlowComplete:
  - runScript: ../../scripts/quest-games-end.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: anita.patel.nc@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'More'
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- scrollUntilVisible:
    element:
      id: more-nav-quest
    centerElement: true
- tapOn:
    id: more-nav-quest
- extendedWaitUntil:
    visible:
      id: quest-games
    timeout: 15000
- assertVisible: 'Play the question bank together: start a game and share its code, or join one with a code\.'
- assertNotVisible:
    id: quest-play-card
- assertNotVisible:
    id: quest-review-card
- takeScreenshot: game-hub-parent
# Start a game: the wizard.
- tapOn:
    id: game-new
- extendedWaitUntil:
    visible:
      id: screen-quest-new-game
    timeout: 10000
# Only levels with questions to draw have a tile; each says its count.
- extendedWaitUntil:
    visible:
      id: game-tile-NC26.6
    timeout: 10000
- assertVisible:
    id: game-tile-NC26.6
    text: 'G6, \d+ questions'
- takeScreenshot: game-wizard-questions
# Random is the last tile, after every level (as on the web): below the fold on a phone.
- scrollUntilVisible:
    element:
      id: game-tile-random
    centerElement: true
- scrollUntilVisible:
    element:
      id: game-tile-NC26.6
    direction: UP
    centerElement: true
- tapOn:
    id: game-tile-NC26.6
- tapOn:
    id: step-flow-next
# Length: a typed amount is held to its range on Done.
- extendedWaitUntil:
    visible:
      id: game-step-2
    timeout: 5000
- assertVisible:
    id: game-mode-count
- tapOn:
    id: game-amount
- eraseText: 5
- inputText: '99'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: game-amount
      text: '50'
    timeout: 5000
- assertVisible:
    id: game-amount-plus
    enabled: false
- tapOn:
    id: game-amount
- eraseText: 5
- inputText: '2'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: game-amount
      text: '2'
    timeout: 5000
- takeScreenshot: game-wizard-length
- tapOn:
    id: step-flow-next
# Scoring: one off for a wrong answer.
- extendedWaitUntil:
    visible:
      id: game-step-3
    timeout: 5000
- assertVisible:
    id: game-wrong
    text: '0'
- tapOn:
    id: game-wrong-minus
- assertVisible:
    id: game-wrong
    text: '−1'
- takeScreenshot: game-wizard-scoring
- tapOn:
    id: step-flow-next
# Players: multiplayer, teams of several, at most 2 a team.
- extendedWaitUntil:
    visible:
      id: game-step-4
    timeout: 5000
- tapOn:
    id: game-players-multi
- tapOn:
    id: game-team-style-teams
- scrollUntilVisible:
    element:
      id: game-team-size-minus
    centerElement: true
- tapOn:
    id: game-team-size-minus
- tapOn:
    id: game-team-size-minus
- assertVisible:
    id: game-team-size
    text: '2'
- assertVisible:
    id: game-team-size-minus
    enabled: false
- takeScreenshot: game-wizard-players
- tapOn:
    id: step-flow-next
# The Review, in words.
- extendedWaitUntil:
    visible:
      id: step-flow-review
    timeout: 5000
- assertVisible:
    id: game-summary-questions
    text: 'G6'
- assertVisible:
    id: game-summary-length
    text: '2 questions'
- assertVisible:
    id: game-summary-scoring
    text: 'Right \+1, wrong −1\. Knockout: Off'
- assertVisible:
    id: game-summary-players
    text: 'Up to 10 teams of up to 2\. Joining: Closed once it starts'
# The step's title, question and hint are one header element (StepFlow's step-flow-title).
- assertVisible:
    id: step-flow-title
    text: '.*Once you generate the code, the settings are fixed\..*'
- takeScreenshot: game-wizard-review
- assertVisible:
    id: game-create
    text: '.*Generate game code.*'
- tapOn:
    id: game-create
# The lobby.
- extendedWaitUntil:
    visible:
      id: screen-quest-game
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: game-lobby-code
    timeout: 10000
# Read as the code spelled out on iOS ("Game code: D D 9 K 6 B"), as the code itself on Android.
- assertVisible:
    id: game-lobby-code
    text: '([A-HJKMNP-Z2-9]{6}|Game code: [A-HJKMNP-Z2-9]( [A-HJKMNP-Z2-9]){5})'
- assertVisible:
    id: game-rules
    text: 'G6 · 2 questions · Right \+1, wrong −1 · Up to 10 teams of up to 2.*'
- assertVisible: '(?i)Game status · waiting to start · game code'
- assertVisible: '0 players · 0 of 10 teams'
- assertVisible: 'Nobody has joined yet\. Share the code\.'
- assertVisible:
    id: game-start
    enabled: false
- assertVisible:
    id: game-cancel
- assertVisible:
    id: game-share
- assertNotVisible:
    id: game-waiting-host
- takeScreenshot: game-lobby-empty
# Alex joins on his own with the code, from "another device".
- copyTextFrom:
    id: game-lobby-code
- evalScript: ${output.gameCode = maestro.copiedText.replace('Game code:', '').replace(/\s/g, '')}
- runScript:
    file: ../../scripts/quest-game-act.js
    env:
      AS: alex
      ACTION: join-solo
      CODE: ${output.gameCode}
- extendedWaitUntil:
    visible:
      id: game-team-Alex
    timeout: 10000
- extendedWaitUntil:
    visible: '1 player · 1 of 10 teams'
    timeout: 5000
- takeScreenshot: game-lobby
- assertVisible:
    id: game-start
    text: '.*Start the Quest.*'
    enabled: true
# The doors keep the screen moving for five seconds: the tap does not wait for it to settle.
- tapOn:
    id: game-start
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: game-countdown-number
    timeout: 5000
- takeScreenshot: game-doors
- extendedWaitUntil:
    notVisible:
      id: game-countdown-number
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: game-hosting
    timeout: 10000
- assertVisible:
    id: game-end
- assertNotVisible:
    id: game-question
- takeScreenshot: game-hosting
# Alex skips both: the game is over.
- runScript:
    file: ../../scripts/quest-game-act.js
    env:
      AS: alex
      ACTION: skip-all
- extendedWaitUntil:
    visible:
      id: game-winner
      text: 'Alex wins!'
    timeout: 15000
- assertVisible:
    id: game-review-team-Alex
- takeScreenshot: game-results-host
- tapOn:
    id: quest-exit
- extendedWaitUntil:
    visible:
      id: screen-quest
    timeout: 10000
- scrollUntilVisible:
    element:
      id: game-row-${output.gameCode}
    centerElement: true
    timeout: 15000
# The row is one element on iOS (its label ends with the status): asserted on the row.
- extendedWaitUntil:
    visible:
      id: game-row-${output.gameCode}
      text: '.*G6 · 2 questions.*You host · 1 team.*Finished'
    timeout: 10000
