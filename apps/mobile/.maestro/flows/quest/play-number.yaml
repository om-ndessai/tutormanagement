# Question Quest (Phase 42), a question answered with a number. Sofia, started at G5 (whose first
# question locally asks for a number), lands in Quest: no choices, a number field whose keypad has the
# fraction bar and the minus sign. She types a fraction; Return only puts the keyboard away -- nothing
# is sent until Submit, as nothing can be taken back. Then "Saved. +1 point", and her points up by one.
# The switch is off again at the end.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/quest-end.js
  - runScript:
      file: ../../scripts/quest-start.js
      env:
        LEVEL: NC26.5
onFlowComplete:
  - runScript: ../../scripts/quest-end.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: sofia.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-quest-play
    timeout: 30000
# The welcome closes itself (it may already have, while signing in finished).
- extendedWaitUntil:
    notVisible:
      id: quest-welcome
    timeout: 7000
- extendedWaitUntil:
    visible:
      id: quest-number
    timeout: 15000
- assertVisible:
    id: quest-level
    text: 'G5'
- assertNotVisible:
    id: quest-choice-A
- assertVisible:
    id: quest-submit
    enabled: false
- tapOn:
    id: quest-number
- takeScreenshot: quest-number-keypad
- inputText: '3/4'
- assertVisible:
    id: quest-number
    text: '3/4'
- pressKey: Enter
# Return sent nothing: no notice, the same points, the answer still in the field.
- assertNotVisible: 'Saved\. \+1 point'
- assertVisible:
    id: quest-points
    text: ${output.questPointsNow}
- assertVisible:
    id: quest-number
    text: '3/4'
- scrollUntilVisible:
    element:
      id: quest-submit
    centerElement: true
- tapOn:
    id: quest-submit
- extendedWaitUntil:
    visible: 'Saved\. \+1 point'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: quest-points
      text: ${output.questPointsNext}
    timeout: 10000
# Exit, and in again from the Quest page: this time the welcome is closed with its Close button.
- tapOn:
    id: quest-exit
- extendedWaitUntil:
    visible:
      id: quest-start
    timeout: 10000
# The welcome's confetti and bar keep the screen moving for its 5 s: the tap does not wait for it
# to settle, or the welcome would be gone before it is looked for.
- tapOn:
    id: quest-start
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: quest-welcome-close
    timeout: 15000
- tapOn:
    id: quest-welcome-close
- extendedWaitUntil:
    notVisible:
      id: quest-welcome
    timeout: 3000
# The next question (a number or a choice) is there to answer.
- assertVisible:
    id: quest-question
