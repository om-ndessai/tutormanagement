# Quest Games (Phase 47), favorites. Priya builds a G6 game through the wizard to its Review and saves it
# as "Friday G6": the toast says so. Closed, then New Quest again: her favorites lead the first step,
# "Friday G6" with its settings in words; one tap fills every step and opens the Review, and Back lands
# on the last step. Then its × asks first (a native confirm), and Delete removes it: the toast says so
# and the favorites are gone. A favorite is the person's own (R20): quest-games-end.js deletes the four
# flow people's, before and after. The switches are off again at the end.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/quest-games-end.js
  - runScript: ../../scripts/quest-games-start.js
onFlowComplete:
  - runScript: ../../scripts/quest-games-end.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'More'
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- scrollUntilVisible:
    element:
      id: more-nav-quest
    centerElement: true
- tapOn:
    id: more-nav-quest
- extendedWaitUntil:
    visible:
      id: screen-quest
    timeout: 15000
- scrollUntilVisible:
    element:
      id: game-new
    centerElement: true
- tapOn:
    id: game-new
- extendedWaitUntil:
    visible:
      id: game-tile-NC26.6
    timeout: 10000
# No favorites yet.
- assertNotVisible:
    id: game-favorites
- tapOn:
    id: game-tile-NC26.6
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: game-step-2
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: game-step-3
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-review
    timeout: 5000
- scrollUntilVisible:
    element:
      id: game-fav-name
    centerElement: true
- tapOn:
    id: game-fav-name
- inputText: 'Friday G6'
# With the keyboard up, the field sits just above the footer and Save just under it (Android): the
# review scrolls it into view.
- scrollUntilVisible:
    element:
      id: game-fav-save
    centerElement: true
- extendedWaitUntil:
    visible:
      id: game-fav-save
      enabled: true
    timeout: 5000
# Done saves it too (as Save does): the keyboard's key, then the toast.
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Saved “Friday G6” to your favorites\.'
    timeout: 10000
- takeScreenshot: game-favorite-saved
- tapOn:
    id: step-flow-close
- extendedWaitUntil:
    notVisible:
      id: screen-quest-new-game
    timeout: 10000
# New Quest again: the favorite leads.
- scrollUntilVisible:
    element:
      id: game-new
    centerElement: true
- tapOn:
    id: game-new
- extendedWaitUntil:
    visible:
      id: game-favorites
    timeout: 10000
- assertVisible:
    id: 'game-fav-Friday G6'
    text: 'Friday G6, G6 · 10 questions · Up to 10 teams, at most 4 players per team'
- takeScreenshot: game-favorites
- tapOn:
    id: 'game-fav-Friday G6'
- extendedWaitUntil:
    visible:
      id: step-flow-review
    timeout: 5000
- assertVisible:
    id: game-summary-questions
    text: 'G6'
- assertVisible:
    id: game-summary-length
    text: '10 questions'
- assertVisible:
    id: game-summary-players
    text: 'Up to 10 teams, at most 4 players per team\. Joining: Closed once it starts'
- tapOn:
    id: step-flow-back
- extendedWaitUntil:
    visible:
      id: game-step-3
    timeout: 5000
- assertVisible:
    id: game-team-size
    text: '4'
- tapOn:
    id: step-flow-close
- extendedWaitUntil:
    notVisible:
      id: screen-quest-new-game
    timeout: 10000
# Delete it: asked first.
- scrollUntilVisible:
    element:
      id: game-new
    centerElement: true
- tapOn:
    id: game-new
- extendedWaitUntil:
    visible:
      id: 'game-fav-delete-Friday G6'
    timeout: 10000
- tapOn:
    id: 'game-fav-delete-Friday G6'
- extendedWaitUntil:
    visible: 'Delete “Friday G6”\?'
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Delete'
          below: 'Delete “Friday G6”\?'
          index: 0
# Android's dialog draws its buttons in capitals: Delete is the positive one.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'android:id/button1'
- extendedWaitUntil:
    visible: 'Deleted “Friday G6”\.'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: game-favorites
    timeout: 10000
- assertNotVisible:
    id: 'game-fav-Friday G6'
- takeScreenshot: game-favorite-deleted
