# Quest Games (Phase 47), a single player. Sofia starts a game through the wizard: Random, starting at G6
# (it draws G6 and up, never below), 2 questions, Single player. The Review has no Knockout or Joining
# lines, and the action is "Start game": the doors count down at once and her first question follows,
# with nobody to wait for. She skips both: "0 right, 0 points" and a line of encouragement. Exit: her game
# listed as "Single player". The switches are off again at the end.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/quest-games-end.js
  - runScript: ../../scripts/quest-games-start.js
onFlowComplete:
  - runScript: ../../scripts/quest-games-end.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: sofia.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'More'
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- scrollUntilVisible:
    element:
      id: more-nav-quest
    centerElement: true
- tapOn:
    id: more-nav-quest
- extendedWaitUntil:
    visible:
      id: quest-games
    timeout: 15000
- scrollUntilVisible:
    element:
      id: game-new
    centerElement: true
- tapOn:
    id: game-new
- extendedWaitUntil:
    visible:
      id: game-tile-NC26.6
    timeout: 10000
- takeScreenshot: game-single-tiles
# Random is the last tile, after every level (as on the web): below the fold on a phone.
- scrollUntilVisible:
    element:
      id: game-tile-random
    centerElement: true
# Random asks for its lowest level before Next.
- tapOn:
    id: game-tile-random
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: game-level-error
      text: 'Choose the lowest level\.'
    timeout: 5000
# Its list is open while no level is chosen. The bank has about 20 levels since round four (2026-10-22),
# so the flow searches for G6 rather than swiping the list, which a swipe could carry past it.
- scrollUntilVisible:
    element:
      id: game-random-start-search
    centerElement: true
- tapOn:
    id: game-random-start-search
- inputText: 'G6'
# The one match sits under the keyboard: the search key puts it away (hideKeyboard does not on iOS 27),
# then the match is brought into view.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: game-random-start-NC26.6
    centerElement: true
- tapOn:
    id: game-random-start-NC26.6
- extendedWaitUntil:
    visible:
      id: game-random-start
      text: '.*G6.*'
    timeout: 5000
- assertVisible: 'Questions come at random from this level and the ones above it, never below\.'
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: game-step-2
    timeout: 5000
- tapOn:
    id: game-amount
- eraseText: 5
- inputText: '2'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: game-amount
      text: '2'
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: game-step-3
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: game-step-4
    timeout: 5000
- tapOn:
    id: game-players-single
- assertNotVisible:
    id: game-max-teams
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-review
    timeout: 5000
- assertVisible:
    id: game-summary-questions
    text: 'G6 and up, at random'
- assertVisible:
    id: game-summary-scoring
    text: 'Right \+1, wrong 0'
- assertVisible:
    id: game-summary-players
    text: 'Single player'
# The step's title, question and hint are one header element (StepFlow's step-flow-title).
- assertVisible:
    id: step-flow-title
    text: '.*The game starts as soon as you press Start game\..*'
- assertVisible:
    id: game-create
    text: '.*Start game.*'
- takeScreenshot: game-single-review
# Started at once: the doors, then her first question.
- tapOn:
    id: game-create
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: game-countdown-number
    timeout: 15000
- takeScreenshot: game-single-doors
- extendedWaitUntil:
    notVisible:
      id: game-countdown-number
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: game-question-number
      text: '(?i)Question 1 of 2'
    timeout: 15000
- assertNotVisible:
    id: game-lobby-code
# The question's maths is drawn in web views that mount as the doors open (under the doors it is
# "Get ready", as on the web): until they report their height the panel grows, and Skip moves down
# under a tap aimed at it (it landed on a choice). Wait for the choices' native targets, which appear
# once drawn; a number question has none, so this waits its time out and the stem is drawn by then.
- extendedWaitUntil:
    visible:
      id: game-choice-A
    timeout: 5000
    optional: true
# A tap that lands while the maths is still settling can miss: if the next question has not come, the
# tap is tried again (a tap that took is never repeated: the wait passes and the retry ends).
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: game-skip
      - extendedWaitUntil:
          visible:
            id: game-question-number
            text: '(?i)Question 2 of 2'
          timeout: 6000
# The same web views take the second question in place: its height settles as it is drawn.
- extendedWaitUntil:
    visible:
      id: game-choice-A
    timeout: 5000
    optional: true
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: game-skip
      - extendedWaitUntil:
          visible:
            id: game-winner
            text: '0 right, 0 points'
          timeout: 8000
- assertVisible:
    id: game-encouragement
    text: 'Every question you try makes the next one easier\. Go again!'
- assertNotVisible:
    id: game-end-reason
- takeScreenshot: game-single-results
- tapOn:
    id: quest-exit
- extendedWaitUntil:
    visible:
      id: screen-quest
    timeout: 10000
- scrollUntilVisible:
    element:
      id: game-list
    centerElement: true
    timeout: 15000
- assertVisible:
    id: game-list
- assertVisible: '.*G6 and up, at random · 2 questions.*'
- assertVisible: '.*Single player.*'
