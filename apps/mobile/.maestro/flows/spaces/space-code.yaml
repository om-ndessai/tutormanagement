# Phase 52 (design 63): a self-serve space's admin and its code -- shared through the system sheet,
# made anew behind a confirm (the old one gone), joining switched off and on -- and no email card;
# then the space deleted by typing its name, which lands on the Welcome.
# Self-cleaning: Max is put back to nothing before and after; his own space, never a seeded code.
appId: ${APP_ID}
onFlowStart:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.maker@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: signup, EMAIL: spaces.maker@example.com, NAME: Max Maker }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: make-space, EMAIL: spaces.maker@example.com, NAME: Maker Test Space }
  # Through the welcome wizard already: it is not this flow's subject.
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: tour-done, EMAIL: spaces.maker@example.com, ORG: '${output.slug}' }
onFlowComplete:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.maker@example.com }
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.maker@example.com
      ORG: ${output.slug}
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# A first visit to the space offers the tour, floating over every screen: not now.
- extendedWaitUntil:
    visible:
      id: tour-offer
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: tour-offer
    commands:
      - tapOn:
          id: tour-offer-dismiss
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://organization
- extendedWaitUntil:
    visible:
      id: space-code-value
      text: ${output.codeShown}
    timeout: 20000
- takeScreenshot: spaces-space-code
- assertNotVisible:
    id: org-notifications
- tapOn:
    id: space-code-share
- takeScreenshot: spaces-share-sheet
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      # Outside the sheet, above it: the sheet closes.
      - tapOn:
          point: '50%,12%'
- extendedWaitUntil:
    visible:
      id: space-code-renew
    timeout: 10000
- tapOn:
    id: space-code-renew
- extendedWaitUntil:
    visible: 'Make a new code?'
    timeout: 5000
- tapOn: 'Make it'
- extendedWaitUntil:
    visible: 'New code made. The old one no longer works.'
    timeout: 15000
- assertNotVisible:
    id: space-code-value
    text: ${output.codeShown}
- tapOn:
    id: space-code-joining
- extendedWaitUntil:
    visible: 'Joining by code is off.'
    timeout: 15000
- tapOn:
    id: space-code-joining
- extendedWaitUntil:
    visible: 'Joining by code is on.'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: space-delete
- assertVisible:
    id: space-delete
    enabled: false
- tapOn:
    id: space-delete-name
- inputText: 'maker test space'
# Return deletes once the name matches (the button is under the keyboard on a phone).
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: welcome-title
    timeout: 20000
- scrollUntilVisible:
    element:
      id: welcome-delete-account
- tapOn:
    id: welcome-delete-account
- extendedWaitUntil:
    visible: 'Delete your account?'
    timeout: 5000
- tapOn: 'Delete'
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 15000
