# Phase 52 (design 63): signing up with developer sign-in. The legal line on sign-in; an address the
# server does not know offers "Sign up as"; About you refuses a child (nothing kept by the server, so the
# same address still offers sign-up). Phase 70 (UI audit JF8, owner 2026-11-04): the phone remembers the
# refusal, so the same address goes straight to "Ask a grown-up to add you"; a fresh install (cleared state)
# asks again, which is how the flow goes on to the adult sign-up.
# Phase 63 (P13, docs/stickiness-plan.md): an adult who signs up lands in a space of their own, "Sam's
# space", on its Play home -- no Welcome, no wizard. The Welcome is for someone who belongs nowhere:
# once that space is gone (spaces.js drop-personal), it offers Join with a code and Start a space, and
# deletes the account. The same address signs up once more as a 13-17 (Phase 61, S11): "Tam's space",
# where Spaces offers no Start a space; with it gone, Welcome offers only "Join with a code". Then
# an adult who has just signed up (Stella) starts a space from Spaces -- the name, "Invite people"
# skipped -- and lands in it. The app signs in through developer sign-in only (the providers' native
# SDKs cannot be driven here); each provider's path is the web's spaces-welcome.spec.ts.
# Self-cleaning: both addresses are put back to nothing before and after (their spaces go with them).
appId: ${APP_ID}
onFlowStart:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.signup@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.starter@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: signup, EMAIL: spaces.starter@example.com, NAME: Stella Starter }
onFlowComplete:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.signup@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.starter@example.com }
tags:
  - feature
  - smoke
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 30000
# Only marks the tour as seen (no `as`): the wizard is not this flow's subject.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://dev/link?tour=seen'
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 20000
- scrollUntilVisible:
    element:
      id: sign-in-legal
- assertVisible:
    id: sign-in-terms
- assertVisible:
    id: sign-in-privacy
- scrollUntilVisible:
    element:
      id: sign-in-email
- tapOn:
    id: sign-in-email
- inputText: 'spaces.signup@example.com'
- pressKey: Enter
# The refusal is under the form: brought into view.
- scrollUntilVisible:
    element:
      id: sign-in-signup
    timeout: 20000
- assertVisible: 'Sign up as spaces.signup@example.com'
- tapOn:
    id: sign-in-signup
- extendedWaitUntil:
    visible:
      id: screen-sign-up
    timeout: 15000
- tapOn:
    id: signup-dev-name
- inputText: 'Sam Signup'
- assertVisible: 'Welcome, Sam'
# A child: June 2020.
- tapOn:
    id: signup-month
- tapOn:
    id: signup-month-6
- tapOn:
    id: signup-year
- tapOn:
    id: signup-year-search
- inputText: '2020'
# The year is shown above the keyboard: it is tapped there. No hideKeyboard: on iOS its gesture lands on the
# form (since the months became a grid it closed the year's list, or opened the privacy link).
- tapOn:
    id: signup-year-2020
# The year's list closes: let the form settle before the tick is tapped.
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      id: signup-accept
- tapOn:
    id: signup-accept
# Ticked: Continue is enabled (a tick's state is not readable on iOS, Continue's is). The first tap
# after the year's list closes is sometimes taken by the form settling: then once more.
- runFlow:
    when:
      notVisible:
        id: signup-submit
        enabled: true
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          id: signup-accept
- assertVisible:
    id: signup-submit
    enabled: true
- scrollUntilVisible:
    element:
      id: signup-submit
- tapOn:
    id: signup-submit
- extendedWaitUntil:
    visible:
      id: signup-too-young
    timeout: 15000
- assertVisible:
    id: signup-too-young-title
    text: 'Ask a grown-up to add you'
# Guest play is off in this flow: no promise of play, and the way back is sign-in.
- assertVisible:
    id: signup-too-young-body
    text: 'You need to be 13 or older for an account of your own. A grown-up can sign up.*'
- takeScreenshot: spaces-too-young
- tapOn:
    id: signup-too-young-back
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 15000
# Nothing was kept on the server: the same address is still unknown.
- scrollUntilVisible:
    element:
      id: sign-in-email
- tapOn:
    id: sign-in-email
- eraseText: 40
- inputText: 'spaces.signup@example.com'
- pressKey: Enter
# The refusal is under the form: brought into view.
- scrollUntilVisible:
    element:
      id: sign-in-signup
    timeout: 20000
- tapOn:
    id: sign-in-signup
# The phone remembers the refusal (a key of the address, never the address): no age question this time.
- extendedWaitUntil:
    visible:
      id: signup-too-young
    timeout: 15000
- assertNotVisible:
    id: signup-month
- takeScreenshot: spaces-too-young-remembered
# A fresh install remembers nothing: the adult sign-up, with the same address.
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://dev/link?tour=seen'
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 20000
- scrollUntilVisible:
    element:
      id: sign-in-email
- tapOn:
    id: sign-in-email
- inputText: 'spaces.signup@example.com'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: sign-in-signup
    timeout: 20000
- tapOn:
    id: sign-in-signup
- extendedWaitUntil:
    visible:
      id: screen-sign-up
    timeout: 15000
- tapOn:
    id: signup-dev-name
- inputText: 'Sam Signup'
# An adult: June 1990.
- tapOn:
    id: signup-month
- tapOn:
    id: signup-month-6
- tapOn:
    id: signup-year
- tapOn:
    id: signup-year-search
- inputText: '1990'
# The year is shown above the keyboard: it is tapped there. No hideKeyboard: on iOS its gesture lands on the
# form (since the months became a grid it closed the year's list, or opened the privacy link).
- tapOn:
    id: signup-year-1990
# The year's list closes: let the form settle before the tick is tapped.
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      id: signup-accept
- tapOn:
    id: signup-accept
# Ticked: Continue is enabled (a tick's state is not readable on iOS, Continue's is). The first tap
# after the year's list closes is sometimes taken by the form settling: then once more.
- runFlow:
    when:
      notVisible:
        id: signup-submit
        enabled: true
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          id: signup-accept
- assertVisible:
    id: signup-submit
    enabled: true
- takeScreenshot: spaces-about-you
- scrollUntilVisible:
    element:
      id: signup-submit
- tapOn:
    id: signup-submit
# Phase 63 (P13): in a space of her own at once -- its Play home, no Welcome, no wizard.
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
- assertNotVisible:
    id: welcome-title
- assertNotVisible:
    id: screen-onboarding
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-roles
    text: ".*Admin at Sam's space"
- takeScreenshot: spaces-personal-space
# Belonging nowhere (her own space gone): the Welcome.
- runScript:
    file: ../../scripts/spaces.js
    env: { ACTION: drop-personal, EMAIL: spaces.signup@example.com }
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.signup@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: screen-spaces
    timeout: 30000
- assertVisible:
    id: welcome-title
    text: 'Welcome to Aimtrue'
- assertVisible:
    id: welcome-join
- assertVisible:
    id: welcome-make
# Phase 61 (S11): the two choices, and what Welcome says.
- assertVisible: '.*Join a space with its code, or start your own\..*'
- assertVisible: 'Join with a code'
- assertVisible: 'Start a space'
- takeScreenshot: spaces-welcome
- scrollUntilVisible:
    element:
      id: welcome-delete-account
- tapOn:
    id: welcome-delete-account
- extendedWaitUntil:
    visible: 'Delete your account?'
    timeout: 5000
- tapOn: 'Delete'
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 15000
# Phase 61 (S11): the same address, now a 13-17 (January 2011). About you as before; Phase 63: Tam's
# own space, where Spaces offers no Start a space; with it gone, Welcome offers only "Join with a code"
# -- starting a space is for adults.
- scrollUntilVisible:
    element:
      id: sign-in-email
- tapOn:
    id: sign-in-email
- eraseText: 40
- inputText: 'spaces.signup@example.com'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: sign-in-signup
    timeout: 20000
- tapOn:
    id: sign-in-signup
- extendedWaitUntil:
    visible:
      id: screen-sign-up
    timeout: 15000
- tapOn:
    id: signup-dev-name
- inputText: 'Tam Teen'
- assertVisible: 'Welcome, Tam'
- tapOn:
    id: signup-month
- tapOn:
    id: signup-month-1
- tapOn:
    id: signup-year
- tapOn:
    id: signup-year-search
- inputText: '2011'
- tapOn:
    id: signup-year-2011
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      id: signup-accept
- tapOn:
    id: signup-accept
- runFlow:
    when:
      notVisible:
        id: signup-submit
        enabled: true
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          id: signup-accept
- assertVisible:
    id: signup-submit
    enabled: true
- scrollUntilVisible:
    element:
      id: signup-submit
- tapOn:
    id: signup-submit
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
- assertNotVisible:
    id: welcome-title
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-roles
    text: ".*Admin at Tam's space"
# Spaces (All spaces): Join with a code, and no Start a space for a 13-17.
- scrollUntilVisible:
    element:
      id: account-spaces
- tapOn:
    id: account-spaces
- extendedWaitUntil:
    visible:
      id: screen-spaces
    timeout: 10000
- scrollUntilVisible:
    element:
      id: welcome-join
- scrollUntilVisible:
    element:
      id: welcome-adults-only
- assertNotVisible:
    id: welcome-make
- takeScreenshot: spaces-personal-space-teen
- runScript:
    file: ../../scripts/spaces.js
    env: { ACTION: drop-personal, EMAIL: spaces.signup@example.com }
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.signup@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: screen-spaces
    timeout: 30000
- assertVisible:
    id: welcome-title
    text: 'Welcome to Aimtrue'
- assertVisible:
    id: welcome-join
- assertVisible: 'Join with a code'
- assertNotVisible:
    id: welcome-make
- assertNotVisible:
    id: welcome-space-name
- scrollUntilVisible:
    element:
      id: welcome-adults-only
# The way forward for a 13-17 (UI audit JF7), not a grey no.
- assertVisible: 'A club needs an adult to start its space'
- assertVisible: 'Ask a teacher or a parent to start it, then join it with its code here\.'
- takeScreenshot: spaces-welcome-teen
# Phase 61 (S11) and Phase 63 (P13): an adult who has just signed up (Stella, made by the script)
# lands in her own space and starts another from Spaces, then lands in it. A fresh device, so the
# welcome wizard is not pre-empted in the new space (her own never opens it).
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.starter@example.com
      ORG: ''
      FRESH: '1'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertNotVisible:
    id: welcome-title
- assertNotVisible:
    id: screen-onboarding
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-roles
    text: ".* at Stella's space"
- scrollUntilVisible:
    element:
      id: account-spaces
- tapOn:
    id: account-spaces
- extendedWaitUntil:
    visible:
      id: screen-spaces
    timeout: 10000
- scrollUntilVisible:
    element:
      id: welcome-join
- scrollUntilVisible:
    element:
      id: welcome-make
- assertVisible: 'Start a space'
- scrollUntilVisible:
    element:
      id: welcome-space-name
- tapOn:
    id: welcome-space-name
- inputText: 'The Starter family'
- hideKeyboard
- tapOn:
    id: welcome-make-submit
- extendedWaitUntil:
    visible: 'The Starter family is ready.'
    timeout: 15000
# S12's step comes first; skipping it goes on to the wizard, then the space's Home.
- extendedWaitUntil:
    visible:
      id: screen-onboarding-invite
    timeout: 30000
- scrollUntilVisible:
    element:
      id: invite-skip
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: invite-skip
      - extendedWaitUntil:
          visible:
            id: screen-onboarding
          timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: onboarding-close
      - extendedWaitUntil:
          visible:
            id: screen-home
          timeout: 8000
- assertNotVisible:
    id: welcome-title
- takeScreenshot: spaces-started
# Launched again, Stella lands in the space she opened last -- the new one, not her own.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.starter@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertNotVisible:
    id: welcome-title
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-roles
    text: '.* at The Starter family'
