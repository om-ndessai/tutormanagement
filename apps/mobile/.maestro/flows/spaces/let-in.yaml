# Phase 52 (design 63): an admin lets in someone who asked to join. UI audit JF1 (owner, 2026-11-04):
# Let in is a short sheet -- the whole address and when they asked, the role (Parent by default, Admin;
# no Tutor in a space without Tutoring), "Something else? The full form" one tap away (the person form on
# the request: their name and address, not editable) -- then, for a parent, "Which child is Jo's?": a
# student here, their child added now, or Later. The request leaves the list as soon as they are in.
# The last admin cannot leave. The person let in lands straight in the space, leaves it from My profile,
# and deletes their account.
# Self-cleaning: Jo is put back to nothing, signed up and asking, before; nothing, after.
# Phase 63 (P13): signing up now also makes a personal space; Jo drops theirs at once
# (spaces.js `PERSONAL: drop`), so they start out belonging where this flow says, as before.
# Phase 72 (UI audit JF26; owner 2026-11-04): Jo asks to help run the space, with a note. The request says the role
# beside when they asked, and the note in quotes; the Let in sheet says both and starts on Admin, the role asked for.
# Ines then chooses Parent, the short way this flow goes on with.
appId: ${APP_ID}
onFlowStart:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.joiner@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: signup, EMAIL: spaces.joiner@example.com, NAME: Jo Joiner, PERSONAL: drop }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: ask, EMAIL: spaces.joiner@example.com, CODE: FMXY2345, ROLE: admin, NOTE: 'I help Ines on Saturdays.' }
onFlowComplete:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.joiner@example.com }
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: ines.ferreira.assess@gmail.com
      ORG: assess
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://people
- extendedWaitUntil:
    visible:
      id: join-requests
    timeout: 20000
- assertVisible: 'Jo Joiner'
# The whole address, and when they asked, at every width (JF26); since Phase 72, as what, and their note.
- assertVisible: 'spaces.joiner@example.com'
- assertVisible: 'asked .* · as helping run it'
- assertVisible:
    id: join-request-note-.*
    text: '“I help Ines on Saturdays\.”'
- takeScreenshot: spaces-join-request-role-note
- tapOn:
    id: join-request-let-in-.*
- extendedWaitUntil:
    visible:
      id: let-in-sheet
    timeout: 15000
- assertVisible: 'Let Jo Joiner in'
- assertVisible: '.*spaces.joiner@example.com · asked.*'
# What they asked, and the sheet starts there.
- assertVisible:
    id: let-in-asked
- assertVisible: 'Asked as helping run it\.'
- assertVisible: '“I help Ines on Saturdays\.”'
- assertVisible:
    id: let-in-role-admin
    selected: true
- assertVisible:
    id: let-in-role-parent
    selected: false
- assertVisible: 'Parent. Their child is, or will be, in this space.'
- assertNotVisible:
    id: let-in-role-tutor
- takeScreenshot: spaces-let-in-sheet
# Anything else: the full form, on the same request.
- tapOn:
    id: let-in-full-form
- extendedWaitUntil:
    visible:
      id: person-form-title
      text: 'Let Jo Joiner in'
    timeout: 15000
- assertVisible:
    id: person-form-name
    text: 'Jo Joiner'
- assertVisible:
    id: person-form-email
    text: 'spaces.joiner@example.com'
- scrollUntilVisible:
    element:
      id: person-form-cancel
- tapOn:
    id: person-form-cancel
- extendedWaitUntil:
    visible:
      id: join-requests
    timeout: 15000
# The short way: a parent (the sheet started on Admin, the role asked for).
- tapOn:
    id: join-request-let-in-.*
- extendedWaitUntil:
    visible:
      id: let-in-submit
    timeout: 15000
- assertVisible:
    id: let-in-role-admin
    selected: true
- tapOn:
    id: let-in-role-parent
- assertVisible:
    id: let-in-role-parent
    selected: true
- tapOn:
    id: let-in-submit
- extendedWaitUntil:
    visible: "Which child is Jo's?"
    timeout: 15000
- assertVisible:
    id: let-in-student
- assertVisible:
    id: let-in-add-child
    text: ".*Add Jo's child now"
- tapOn:
    id: let-in-later
- extendedWaitUntil:
    visible:
      id: screen-people
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: join-requests
    timeout: 15000
- assertVisible: 'Jo Joiner'
# The only admin cannot leave: the server's words, and nothing moves.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://organization
- extendedWaitUntil:
    visible:
      id: screen-organization
    timeout: 20000
- scrollUntilVisible:
    element:
      id: space-leave
- tapOn:
    id: space-leave
- extendedWaitUntil:
    visible: 'Leave Ferreira Family Practice?'
    timeout: 5000
- tapOn: 'Leave'
- extendedWaitUntil:
    visible: '.*only administrator.*'
    timeout: 15000
- assertVisible:
    id: screen-organization
# Jo: straight into the one space (through the welcome wizard already: it is not this flow's
# subject); leaves from My profile.
- runScript:
    file: ../../scripts/spaces.js
    env: { ACTION: tour-done, EMAIL: spaces.joiner@example.com, ORG: assess }
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.joiner@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# A first visit to the space offers the tour, floating over every screen: not now.
- extendedWaitUntil:
    visible:
      id: tour-offer
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: tour-offer
    commands:
      - tapOn:
          id: tour-offer-dismiss
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://profile
- extendedWaitUntil:
    visible:
      id: screen-profile
    timeout: 20000
- scrollUntilVisible:
    element:
      id: profile-legal
- assertVisible:
    id: profile-terms
- tapOn:
    id: space-leave
- extendedWaitUntil:
    visible: 'Leave Ferreira Family Practice?'
    timeout: 5000
- tapOn: 'Leave'
- extendedWaitUntil:
    visible:
      id: welcome-title
    timeout: 20000
- scrollUntilVisible:
    element:
      id: welcome-delete-account
- tapOn:
    id: welcome-delete-account
- extendedWaitUntil:
    visible: 'Delete your account?'
    timeout: 5000
- tapOn: 'Delete'
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 15000
