# Phase 52 (design 63): an admin declines a request to join, behind a confirm; the person who asked
# sees the decline on the Welcome, and as a 13-17 may not start a space -- though since Phase 80 (A12) he may make one
# of his own, his only door ("Make my own space", under Join with a code).
# UI audit (JF5; owner, 2026-11-04): the decline stays, with its day and Ask again, until Theo dismisses it --
# signing in again still shows it; dismissed, it is gone.
# Self-cleaning: any old answer is dismissed, and Theo's request to Riverside (the seed's) is asked again,
# before and after.
appId: ${APP_ID}
onFlowStart:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: dismiss, EMAIL: theo.teen@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: ask, EMAIL: theo.teen@example.com, CODE: RVRS2345 }
onFlowComplete:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: dismiss, EMAIL: theo.teen@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: ask, EMAIL: theo.teen@example.com, CODE: RVRS2345 }
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: rosa.delgado.tutoring@gmail.com
      ORG: riverside
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://people
- extendedWaitUntil:
    visible:
      id: join-requests
    timeout: 20000
- assertVisible:
    id: join-requests-count
- assertVisible: 'Theo Teen'
- takeScreenshot: spaces-people-request
- tapOn:
    id: join-request-decline-.*
- extendedWaitUntil:
    visible: 'Decline Theo Teen’s request?'
    timeout: 5000
- assertVisible: 'They will see that this space did not let them in. They can ask again with the code.'
- tapOn: 'Decline request'
- extendedWaitUntil:
    visible: 'Theo Teen’s request declined.'
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: join-requests
    timeout: 15000
# Theo sees it, with its day and Ask again.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: theo.teen@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: welcome-declined-riverside
    timeout: 30000
- assertVisible: '.*Riverside Tutoring did not let you in.*'
- assertVisible: '.*Declined on .*'
- assertVisible:
    id: welcome-ask-again-riverside
# Phase 80 (A12): a space of his own, a teen's only door, under Join with a code.
- scrollUntilVisible:
    element:
      id: welcome-make-own
    centerElement: true
# A 13-17 reads the way forward, not a grey no (UI audit JF7). Below the card since Phase 80: brought into view.
- scrollUntilVisible:
    element:
      id: welcome-adults-only
- assertVisible:
    id: welcome-adults-only
- assertVisible: 'A club needs an adult to start its space'
- assertVisible: 'Ask a teacher or a parent to start it, then join it with its code here\.'
- assertNotVisible:
    id: welcome-make
# Signing in again, it is still there: an answer stays until it is dismissed.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: theo.teen@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: welcome-declined-riverside
    timeout: 30000
- tapOn:
    id: welcome-dismiss-riverside
- extendedWaitUntil:
    notVisible:
      id: welcome-declined-riverside
    timeout: 15000
- assertVisible:
    id: welcome-join
