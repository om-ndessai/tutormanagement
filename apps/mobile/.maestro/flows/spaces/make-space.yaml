# Phase 52 (design 63): a newcomer makes a space of their own. Since Phase 63 (P13) sign-up lands her
# in her personal space ("Mia's space"), and she starts another from Spaces. A reserved word is refused
# on the device; a good name makes the space and enters it, where the welcome wizard opens by itself;
# "This is my child" makes the maker the family, and adding the child in a self-serve space needs
# the parent's consent. Then the space is deleted (back to her own), her own space dropped by script,
# and the account deleted from the Welcome.
# Self-cleaning: Mia is put back to nothing before and after (her space goes with her).
appId: ${APP_ID}
onFlowStart:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.creator@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: signup, EMAIL: spaces.creator@example.com, NAME: Mia Creator }
onFlowComplete:
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: spaces.creator@example.com }
tags:
  - feature
---
# A fresh device, so the wizard is not pre-empted.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.creator@example.com
      ORG: ''
      FRESH: '1'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 63 (P13): signed up, Mia lands in a space of her own, "Mia's space", on its Play home -- no
# Welcome, and no wizard there. Start a space is on Spaces, from the account sheet's "All spaces".
- assertNotVisible:
    id: welcome-title
- assertNotVisible:
    id: screen-onboarding
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-roles
    text: ".* at Mia's space"
- scrollUntilVisible:
    element:
      id: account-spaces
- tapOn:
    id: account-spaces
- extendedWaitUntil:
    visible:
      id: screen-spaces
    timeout: 10000
- scrollUntilVisible:
    element:
      id: welcome-space-name
- tapOn:
    id: welcome-space-name
- inputText: 'Aimtrue official'
- hideKeyboard
- tapOn:
    id: welcome-make-submit
- extendedWaitUntil:
    visible:
      id: welcome-make-error
      text: 'A space’s name cannot use the word “aimtrue”.'
    timeout: 5000
- tapOn:
    id: welcome-space-name
- eraseText: 30
- inputText: 'The Creator family'
- hideKeyboard
- tapOn:
    id: welcome-make-submit
- extendedWaitUntil:
    visible: 'The Creator family is ready.'
    timeout: 15000
# In it, "Invite people" opens first (Phase 61, S12): Admin and Parent, never Tutor in a newcomer's
# space; a row is checked on the device; the space's code is there too. Skip goes on to the wizard,
# which opens by itself.
- extendedWaitUntil:
    visible:
      id: screen-onboarding-invite
    timeout: 30000
- assertVisible:
    id: onboarding-title
    text: 'Invite people'
- assertVisible: 'Ask the adults who will use The Creator family to join you. They accept when they sign in.'
- assertVisible:
    id: invite-role-0-admin
- assertVisible:
    id: invite-role-0-parent
- assertNotVisible:
    id: invite-role-0-tutor
- tapOn:
    id: invite-email-0
- inputText: 'not-an-email'
- hideKeyboard
- tapOn:
    id: invite-send
- extendedWaitUntil:
    visible:
      id: invite-problem-0
      text: 'Enter a valid email address.'
    timeout: 5000
- takeScreenshot: spaces-invite-step
- scrollUntilVisible:
    element:
      id: space-code
- scrollUntilVisible:
    element:
      id: invite-skip
- tapOn:
    id: invite-skip
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 15000
- tapOn:
    id: onboarding-choice-student
- extendedWaitUntil:
    visible:
      id: student-flow-student
    timeout: 10000
- tapOn:
    id: student-flow-my-child
# Phase 74 (JF31): no Tutoring here, so nobody is billed -- the family step asks who looks after the student.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who looks after this student\?.*'
    timeout: 15000
- assertVisible: '.*Mia Creator.*'
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who is the student\?.*'
    timeout: 5000
- tapOn:
    id: add-student-name
- inputText: 'Kit Creator'
- hideKeyboard
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*School and goal.*'
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-review
    timeout: 5000
# Without the parent's word, nothing is sent.
- scrollUntilVisible:
    element:
      id: add-student-consent
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: add-student-consent-error
    timeout: 5000
- tapOn:
    id: add-student-consent
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: student-flow-start
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: onboarding-close
      - extendedWaitUntil:
          visible:
            id: screen-home
          timeout: 8000
# The space goes, by its name.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://organization
- extendedWaitUntil:
    visible:
      id: screen-organization
    timeout: 20000
- scrollUntilVisible:
    element:
      id: space-delete-name
- tapOn:
    id: space-delete-name
- inputText: 'The Creator family'
# Return deletes once the name matches (the button is under the keyboard on a phone).
- pressKey: Enter
# Phase 63 (P13): her own space is left, and nothing is pending, so the landing rule enters it.
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
# A fresh device, and she has met the wizard: the tour may be offered, floating over Home. Not now.
- extendedWaitUntil:
    visible:
      id: tour-offer
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: tour-offer
    commands:
      - tapOn:
          id: tour-offer-dismiss
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-roles
    text: ".* at Mia's space"
# Her own space goes too (as typing its name on its Space page would), and she belongs nowhere: the
# Welcome, where she deletes the account.
- runScript:
    file: ../../scripts/spaces.js
    env: { ACTION: drop-personal, EMAIL: spaces.creator@example.com }
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: spaces.creator@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: welcome-title
    timeout: 30000
- scrollUntilVisible:
    element:
      id: welcome-delete-account
- tapOn:
    id: welcome-delete-account
- extendedWaitUntil:
    visible: 'Delete your account?'
    timeout: 5000
- tapOn: 'Delete'
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 15000
