# Phase 59, S1 (docs/spaces-plan.md): "Organization" leaves every screen, in the app. Every screen
# as each kind of reader -- the sign-in screen, an admin, a tutor, a parent and a student in chmi;
# the admin of an Assessment-only space (assess) and of a space paid directly (solo); the platform
# console -- and the admin's tour and the person form, says neither "organization" nor "institute"
# as a generic word. Proper names stay: "Chapel Hill Math Institute", the "Mathematics Institute of
# the Triangle", and the seed's lesson places ("Institute, room 2"). BAD is that rule as one regex,
# matched against every element's text and accessibility label, before and after scrolling.
# Reads only: nothing is saved (the tour is finished by an admin who had finished it already).
appId: ${APP_ID}
tags:
  - feature
env:
  BAD: '(?is).*(organi[sz]ation|\binstitute(?<!chapel hill math institute)(?<!mathematics institute)(?!, room)).*'
---
# Signed out: the sign-in screen, with the platform's blurb.
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ${BAD}
- scroll
- assertNotVisible: ${BAD}
