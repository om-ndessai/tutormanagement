    env:
      LINK: aimtrue://more
- extendedWaitUntil:
    visible:
      id: create-button
    timeout: 20000
- tapOn:
    id: create-button
- extendedWaitUntil:
    visible:
      id: create-sheet
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ${BAD}
- tapOn:
    id: create-action-add-person
- extendedWaitUntil:
    visible:
      id: person-role-student
    timeout: 15000
- assertVisible: '(?s).*Runs the space\. Only admins can add people\..*'
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ${BAD}
- scroll
- assertNotVisible: ${BAD}
- scroll
- assertNotVisible: ${BAD}
- takeScreenshot: spaces-words-person-form
- runFlow:
    file: ../../subflows/dismiss-sheet.yaml
    env:
      SHEET: screen-person-form
- runFlow:
    when:
      visible: 'Discard changes\?'
    commands:
      - tapOn: 'Discard'
# The tour, from the account sheet: "Your space at a glance", and every step after it.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://dashboard
- extendedWaitUntil:
    visible:
      id: account-button
    timeout: 20000
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- scrollUntilVisible:
    element:
      id: account-tour
    direction: DOWN
    centerElement: true
- tapOn:
    id: account-tour
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ${BAD}
- scroll
- assertNotVisible: ${BAD}
- tapOn:
    id: onboarding-choice-tour
- extendedWaitUntil:
    visible:
      id: tour-card
    timeout: 15000
- assertVisible:
    id: tour-title
    text: 'Your space at a glance'
- assertNotVisible: ${BAD}
- takeScreenshot: spaces-words-tour
- repeat:
    times: 30
    while:
      visible:
        id: tour-next
    commands:
      - tapOn:
          id: tour-next
      - waitForAnimationToEnd:
          timeout: 2000
      - assertNotVisible: ${BAD}
- tapOn:
    id: tour-finish
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: ${BAD}
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            visible:
              id: onboarding-close
          commands:
            - tapOn:
                id: onboarding-close
      - extendedWaitUntil:
          visible:
            id: screen-home
          timeout: 8000
