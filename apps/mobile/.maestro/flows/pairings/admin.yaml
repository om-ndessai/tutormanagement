# The office pairs a tutor with a student, changes the pairing's rate, and removes it. Priya assigns
# Adeline Quintero to Alex. Phase 75 (JF27): the rate fields arrive EMPTY -- following Alex's default, which they
# name -- never a copy of it; she types an in-person rate (an override, so "custom"), then edits it, then removes
# the pairing. "No price set" reads on a pairing whose student has no price (JF18). Changes data: reset the
# database afterwards.
appId: ${APP_ID}
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://pairings
- extendedWaitUntil:
    visible:
      id: pairings-add-button
    timeout: 20000
- assertVisible: 'Which tutor teaches which student, and what the tutor is paid for it.'
# The button renders before the list arrives.
- extendedWaitUntil:
    visible: 'Tutor pay, in person:'
    timeout: 20000
- tapOn:
    id: pairings-add-button
- extendedWaitUntil:
    visible:
      id: assignment-tutor-00000000-0000-4000-8000-000000000003
    timeout: 15000
- assertVisible: 'Pair a tutor with a student'
- tapOn:
    id: assignment-tutor-00000000-0000-4000-8000-000000000003
- extendedWaitUntil:
    visible:
      id: assignment-student-33333333-0000-4000-8000-000000000042
    timeout: 10000
- tapOn:
    id: assignment-student-33333333-0000-4000-8000-000000000042
# Never prefilled: empty fields follow Alex's default, and say so.
- extendedWaitUntil:
    visible:
      id: assignment-rate-hint
      text: "Blank follows Alex's default\\. Type a rate only for a different one\\."
    timeout: 10000
- assertVisible: 'Tutor pay, in person'
- assertVisible: 'Tutor pay, virtual'
- assertNotVisible: '75\.00'
- assertNotVisible: "From Alex Chen's profile.*"
- takeScreenshot: pairings-admin-empty-rates
- tapOn:
    id: assignment-rate-in-person
- inputText: '80'
- pressKey: Enter
# Phase 33's locations checklist sits between the rates and Save: bring Save into view first.
- scrollUntilVisible:
    element:
      id: assignment-save
    direction: DOWN
    timeout: 10000
- tapOn:
    id: assignment-save
- extendedWaitUntil:
    visible: 'Student assigned.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: screen-pairings
    timeout: 10000
- scrollUntilVisible:
    element: "Edit Adeline Quintero's assignment"
    direction: DOWN
    timeout: 30000
- assertVisible: 'Adeline Quintero'
# Her own rate is the pairing's ("custom"); the virtual one follows Alex's default.
- assertVisible:
    id: 'pairing-custom-in-person-.*'
- takeScreenshot: pairings-admin-created
- tapOn: "Edit Adeline Quintero's assignment"
- extendedWaitUntil:
    visible:
      id: assignment-rate-in-person
    timeout: 10000
- assertVisible: 'Edit pairing'
- assertVisible: '80.00'
- tapOn:
    id: assignment-rate-in-person
- eraseText: 10
- inputText: '85'
- pressKey: Enter
# Phase 33's locations checklist sits between the rates and Save: bring Save into view first.
- scrollUntilVisible:
    element:
      id: assignment-save
    direction: DOWN
    timeout: 10000
- tapOn:
    id: assignment-save
- extendedWaitUntil:
    visible: 'Pairing updated.'
    timeout: 15000
- scrollUntilVisible:
    element: '\$85\.00'
    direction: DOWN
    timeout: 20000
- tapOn: 'Remove Adeline Quintero from Alex Chen'
- extendedWaitUntil:
    visible: 'Remove Adeline Quintero from Alex Chen\?'
    timeout: 10000
- tapOn: 'Remove'
- extendedWaitUntil:
    visible: 'Adeline Quintero removed from Alex Chen.'
    timeout: 15000
- assertNotVisible: "Edit Adeline Quintero's assignment"
