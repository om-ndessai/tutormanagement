# The organization's email notifications (Priya, admin): the switch saves at once, off and on; with
# them on, a recorded lesson is logged for the people it concerns -- names and outcomes only (the
# local Worker simulates the mail binding, so it reads "Sent"). Changes data: the runner resets the
# database.
appId: ${APP_ID}
# The lesson this flow records is removed after it, even when it fails part-way.
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://organization
- extendedWaitUntil:
    visible:
      id: org-tin
    timeout: 20000
- scrollUntilVisible:
    element:
      id: org-notifications-switch
    direction: DOWN
    centerElement: true
# The log is append-only and shared by the whole suite (earlier flows schedule and record lessons
# with notifications on), so its contents depend on run order: the empty state is proved in jest
# (organization-views.test.tsx); here, the section is shown and this flow's own row is pinned below.
- assertVisible: 'Recent emails'
- tapOn:
    id: org-notifications-switch
- extendedWaitUntil:
    visible: 'Email notifications are off.'
    timeout: 10000
- tapOn:
    id: org-notifications-switch
- extendedWaitUntil:
    visible: 'Email notifications are on.'
    timeout: 10000
# A lesson recorded with notifications on: Sofia and her parent are told.
- runScript:
    file: ../../scripts/record-recent-lesson.js
    env:
      TUTOR_EMAIL: alex.chen.math@gmail.com
      TUTOR_ID: 00000000-0000-4000-8000-000000000003
      STUDENT_ID: 00000000-0000-4000-8000-000000000008
      ORG: chmi
# Pulled to refresh, the page reads it back from the server. From the very top: the space code leads
# the screen, and (since Phase 54's "Run by" line) the TIN can count as visible while the page is still
# scrolled, so the pull would only scroll.
- scrollUntilVisible:
    element:
      id: space-code
    direction: UP
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- extendedWaitUntil:
    visible:
      id: org-tin
    timeout: 20000
# This flow's own row, not an older one: Sofia's lesson, told to her parent, moments ago.
- scrollUntilVisible:
    element: 'Session recorded · Sofia Okafor · (just now|1 minute ago|2 minutes ago)'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Maria Okafor'
- assertVisible: '(Sent|Not delivered|Not sent here)'
- assertNotVisible: '.*@.*'
- takeScreenshot: organization-notifications
