# Phase 68 (H10): families. Quest on in chmi (quest-games-start.js). Anita's card for Sanjay says what he
# played this week ("Played N days this week (aim: 3)", counts only) and offers to play with him -- worded
# "Practise together before <day>'s lesson" while his lesson is within three days, else "Play with
# Sanjay". One tap makes a game of two with Anita playing and Sanjay invited: its lobby opens. No money
# on Home. quest-games-end.js ends the game and switches Quest back off.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/quest-games-end.js
  - runScript: ../../scripts/quest-games-start.js
onFlowComplete:
  - runScript: ../../scripts/quest-games-start.js
  - runScript: ../../scripts/quest-games-end.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: anita.patel.nc@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
- scrollUntilVisible:
    element:
      id: home-child-played-00000000-0000-4000-8000-000000000006
    centerElement: true
    timeout: 30000
- assertVisible:
    id: home-child-played-00000000-0000-4000-8000-000000000006
    text: "Played [0-7] days? this week \\(aim: 3\\).*"
- scrollUntilVisible:
    element:
      id: home-child-play-00000000-0000-4000-8000-000000000006
    centerElement: true
    timeout: 15000
- assertVisible:
    id: home-child-play-00000000-0000-4000-8000-000000000006
    text: "(Play with Sanjay|Practise together before .*'s lesson)"
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: play-with-child-card
- tapOn:
    id: home-child-play-00000000-0000-4000-8000-000000000006
# Anita is in the game from the start: its lobby, with its code.
- extendedWaitUntil:
    visible:
      id: game-lobby-code
    timeout: 20000
- takeScreenshot: play-with-child-lobby
