# Phase 62 (P6): the members' Play home. Quest on in chmi; Sofia, a student, opens the app and her Home
# leads with Play, "Have a code?" at the end. Phase 67 (H5): the tiles are the Quest board -- a grade row
# of the grades her tiles reach, the chosen grade's cards in its hue. Grade 6 shows Grade 6's cards and
# not Grade 4's; one tap on G6Q5 makes and begins a single player's game: the doors count down and her
# first question follows ("Question 1 of 5"). Exit brings her back to Home, where Continue offers G6Q5
# again and the board opens on Grade 6. The switches are off again at the end.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/quest-games-end.js
  - runScript: ../../scripts/quest-games-start.js
onFlowComplete:
  - runScript: ../../scripts/quest-games-end.js
tags:
  - smoke
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: sofia.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 66: the Play home is in her "Practice" section, under Next up and the quick actions.
- scrollUntilVisible:
    element:
      id: play-home
    visibilityPercentage: 1
    timeout: 15000
# The grade row, then Grade 4: its cards.
- scrollUntilVisible:
    element:
      id: play-grade-4
    centerElement: true
    speed: 15
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: play-grade-4
- scrollUntilVisible:
    element:
      id: play-tile-G4Q5
    centerElement: true
    speed: 15
- assertNotVisible:
    id: play-tile-G6Q5
# Grade 6: its cards replace Grade 4's.
- scrollUntilVisible:
    element:
      id: play-grade-6
    direction: UP
    centerElement: true
    speed: 15
- tapOn:
    id: play-grade-6
- scrollUntilVisible:
    element:
      id: play-tile-start-G6Q5
    centerElement: true
    speed: 15
- assertNotVisible:
    id: play-tile-G4Q5
- assertVisible: 'Start G6Q5: Quick 5, Grade 6, 5 questions'
- takeScreenshot: play-quest-board
# The Play home is long since Phase 64 (My progress, the Daily): a slow scroll, and its momentum let to
# end, so the tile does not drift on under the header (where a tap lands on the account button).
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: play-home-tiles
- tapOn:
    id: play-tile-start-G6Q5
    waitToSettleTimeoutMs: 500
# One tap: no wizard, no lobby -- the doors, then the first question.
- extendedWaitUntil:
    visible:
      id: game-countdown-number
    timeout: 15000
- assertNotVisible:
    id: game-lobby-code
- extendedWaitUntil:
    visible:
      id: game-question-number
      text: '(?i)Question 1 of 5'
    timeout: 20000
- takeScreenshot: play-home-first-question
- tapOn:
    id: quest-exit
# Exit goes back to Home, where the game was started (from=home); Continue remembers the tile, at the
# top of the Play home (Home kept its scroll position, down by the tile).
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- scrollUntilVisible:
    element:
      id: play-continue
    direction: UP
    timeout: 15000
- assertVisible:
    id: play-continue
    text: '.*Continue G6Q5.*'
# The board opens on the grade last played.
- scrollUntilVisible:
    element:
      id: play-tile-G6Q5
    timeout: 30000
# "Have a code?" sits at the end of the home, under every tile (a long way down on a phone): scrolled to
# its last line, which can be brought on screen but not centred.
- scrollUntilVisible:
    element:
      text: 'Six characters join a game; eight ask to join a space\.'
    timeout: 90000
- assertVisible:
    id: play-code
