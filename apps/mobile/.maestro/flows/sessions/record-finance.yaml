# The office records from Finance (Priya, admin in chmi): the sheet's preview carries the money,
# from the office's side -- the tutor's pay, the family's charge and what the organization keeps.
# Nothing is recorded. From Tutoring the record step flow (U4) shows no money.
appId: ${APP_ID}
# Self-cleaning: leftover lessons, drafts and running lessons from any earlier run (even a failed
# one) are removed before this flow, and whatever this flow leaves is removed after it.
onFlowStart:
  - runScript: ../../scripts/clean-sessions.js
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`.
- tapOn:
    id: tab-sessions
- extendedWaitUntil:
    visible:
      id: tabs-finance
    timeout: 20000
- tapOn:
    id: tabs-finance
- extendedWaitUntil:
    visible:
      id: stat-charged
    timeout: 10000
# The page's own Record button: it carries the tab, so Finance's sheet shows the money (the
# create button always opens the Tutoring sheet).
- tapOn:
    id: sessions-record-button
- extendedWaitUntil:
    visible:
      id: record-pairing-search
    timeout: 15000
- tapOn:
    id: record-pairing-search
- inputText: 'Sanjay'
- extendedWaitUntil:
    visible:
      id: record-pairing-a0000000-0000-4000-8000-000000000004
    timeout: 10000
# Return puts the keyboard away (Maestro's hideKeyboard fails on iOS in a form sheet).
- pressKey: Enter
- tapOn:
    id: record-pairing-a0000000-0000-4000-8000-000000000004
# Phase 75 (JF30): a blank record dates nothing by default -- the day and times are chosen, then the money shows.
- scrollUntilVisible:
    element:
      id: record-length-60
    direction: DOWN
    centerElement: true
    timeout: 20000
- runFlow: ../../subflows/record-choose-when.yaml
- extendedWaitUntil:
    visible:
      id: record-money
    timeout: 10000
- assertVisible: '(?i)tutor pay'
- assertVisible: '\$[0-9,]+\.[0-9]{2}'
- extendedWaitUntil:
    visible: 'Family charged \$[0-9,]+\.[0-9]{2} · .* keeps \$[0-9,]+\.[0-9]{2}'
    timeout: 10000
- assertVisible: 'The tutor is paid in quarter hours at \$[0-9,]+\.[0-9]{2}/hr\.'
- takeScreenshot: record-finance-sheet
- scrollUntilVisible:
    element:
      id: record-cancel
    direction: DOWN
    timeout: 30000
- tapOn:
    id: record-cancel
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
# From Tutoring, recording is the step flow (UI upgrades U4), with no money: not on the student
# step, not with the length.
- scrollUntilVisible:
    element:
      id: tabs-tutoring
    direction: UP
    timeout: 20000
- tapOn:
    id: tabs-tutoring
- tapOn:
    id: sessions-record-button
# Phase 75 (JF30): the lessons still owed, then "Another lesson" -- no money on either. The office owes every
# tutor's, so "Another lesson" is under the list.
- extendedWaitUntil:
    visible:
      id: lessons-owed
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'lessons-owed-.*-record'
    timeout: 15000
- assertVisible: 'Record a lesson'
- assertNotVisible: '.*\$[0-9].*'
- scrollUntilVisible:
    element:
      id: lessons-owed-another
    direction: DOWN
    timeout: 30000
- assertNotVisible: '.*\$[0-9].*'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: lessons-owed-another
- extendedWaitUntil:
    visible:
      id: record-student-input
    timeout: 15000
# Taps during the rise are not delivered (iOS, U3).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: record-student-input
- inputText: 'Sanjay'
- extendedWaitUntil:
    visible:
      id: record-student-row-a0000000-0000-4000-8000-000000000004
    timeout: 10000
- hideKeyboard
- tapOn:
    id: record-student-row-a0000000-0000-4000-8000-000000000004
- assertNotVisible: '.*\$[0-9].*'
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*When was it\?.*'
    timeout: 10000
- runFlow: ../../subflows/record-choose-when.yaml
- extendedWaitUntil:
    visible:
      id: record-preview
    timeout: 10000
- assertVisible: '1 hr'
- assertNotVisible:
    id: record-money
- assertNotVisible: '.*\$[0-9].*'
- assertNotVisible: '(?i).*family charged.*'
- takeScreenshot: record-finance-tutoring-flow
- tapOn:
    id: step-flow-close
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
