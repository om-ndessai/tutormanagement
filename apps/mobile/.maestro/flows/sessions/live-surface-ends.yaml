# The live lesson's system surface (#45) ends when its reader leaves the organization: an
# organization switch and a sign-out end it, whatever the lesson does (immersive-design.md §0.7).
# Alex (tutor in chmi, parent in riverside) has a lesson running in chmi, started by the API: on
# arrival it is found running, the banner and the surface show; in riverside neither does; back in
# chmi both are back; signed out, the surface is gone. The clean-up hooks discard the lesson.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/clean-sessions.js
  - runScript:
      file: ../../scripts/local-api.js
      env:
        METHOD: POST
        API_PATH: /sessions/active
        AS: alex.chen.math@gmail.com
        ORG: chmi
        BODY: '{"student_user_id":"00000000-0000-4000-8000-000000000008","mode":"virtual"}'
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: live-banner
    timeout: 30000
# Found running on arrival: the system surface shows it.
- runFlow:
    file: ../../subflows/live-surface-shade.yaml
    env:
      SHOT: live-surface-found
- runFlow:
    file: ../../subflows/live-surface-state.yaml
    env:
      STATE: showing
# Into riverside: no banner, no surface.
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: account-org-riverside
    timeout: 10000
- tapOn:
    id: account-org-riverside
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertVisible:
    id: home-org
    text: 'Riverside'
- assertNotVisible:
    id: live-banner
- runFlow:
    file: ../../subflows/live-surface-state.yaml
    env:
      STATE: none
# Back in chmi: the lesson is still running, so both are back.
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: account-org-chmi
    timeout: 10000
- tapOn:
    id: account-org-chmi
- extendedWaitUntil:
    visible:
      id: live-banner
    timeout: 30000
- runFlow:
    file: ../../subflows/live-surface-state.yaml
    env:
      STATE: showing
# Signed out: gone.
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- scrollUntilVisible:
    element:
      id: account-sign-out
- tapOn:
    id: account-sign-out
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 15000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://dev/diagnostics
- extendedWaitUntil:
    visible:
      id: diag-live-surface
      text: none
    timeout: 15000
