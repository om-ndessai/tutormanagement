# A new write-up is kept as a draft every 3 seconds (Alex, tutor in chmi). An SSN-shaped note is
# refused before it leaves the phone: the sentence shows under the field, the status says it was not
# autosaved, and closing leaves no draft. Then, in the record step flow (UI upgrades U4), a note
# autosaves, closing says where it went, the Drafts panel holds it (no money), and continuing it
# opens the flow on its write-up; posting makes it a lesson and the draft goes. The lesson is
# deleted at the end, so other flows see the seed.
appId: ${APP_ID}
# Self-cleaning: leftover lessons, drafts and running lessons from any earlier run (even a failed
# one) are removed before this flow, and whatever this flow leaves is removed after it.
onFlowStart:
  - runScript: ../../scripts/clean-sessions.js
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'Sessions'
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 20000
- assertNotVisible:
    id: drafts-panel
# 1. An SSN-shaped note never autosaves. It must be typed before a student is chosen (nothing
# autosaves without a pairing), so no tick can catch it half-typed and keep a prefix. The step flow
# asks for the student first, so this part runs on the record sheet Finance keeps, which writes up
# through the same autosave (`useSessionWriteUp`).
- tapOn:
    id: tabs-finance
- tapOn:
    id: sessions-record-button
- extendedWaitUntil:
    visible:
      id: record-pairing-a0000000-0000-4000-8000-000000000002
    timeout: 15000
- scrollUntilVisible:
    element:
      id: record-planned
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-planned
- inputText: 'SSN 123-45-6789'
# Return closes the keyboard on the short parts of the write-up.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: record-pairing-a0000000-0000-4000-8000-000000000002
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: record-pairing-a0000000-0000-4000-8000-000000000002
# Within one autosave tick the field says why, and nothing was sent. Waited for before any scroll:
# the sheet brings the error into view itself (F-22), and a scroll racing that overshot past the
# field (P3b). Where it stays out of view (Android), it is scrolled to once it exists.
- extendedWaitUntil:
    visible: '.*looks like a Social Security number.*'
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: '.*looks like a Social Security number.*'
    direction: DOWN
    timeout: 20000
- takeScreenshot: autosave-ssn-refused
- scrollUntilVisible:
    element:
      id: record-autosave-status
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: record-autosave-status
    text: 'Not autosaved yet'
- scrollUntilVisible:
    element:
      id: record-cancel
    direction: DOWN
    timeout: 20000
- tapOn:
    id: record-cancel
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
- assertNotVisible: '.*kept as a draft.*'
- scrollUntilVisible:
    element:
      id: tabs-tutoring
    direction: UP
    timeout: 20000
- tapOn:
    id: tabs-tutoring
- extendedWaitUntil:
    visible:
      id: sessions-record-button
    timeout: 10000
- assertNotVisible:
    id: drafts-panel
# 2. A note autosaves, and closing keeps it as a draft.
- runFlow:
    file: ../../subflows/record-lesson-start.yaml
    env:
      PAIRING: a0000000-0000-4000-8000-000000000002
- tapOn:
    id: record-planned
- inputText: 'Autosaved from the phone'
# Return closes the keyboard on the short parts of the write-up.
- pressKey: Enter
# The status sits in the flow's footer, on every card.
- extendedWaitUntil:
    visible:
      id: record-autosave-status
      text: 'Draft autosaved .*'
    timeout: 15000
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: autosave-saved
# Leaving a new write-up never asks: it is kept.
- tapOn:
    id: step-flow-close
- extendedWaitUntil:
    visible: 'Your write-up is kept as a draft. Pick it up from Drafts.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: drafts-panel
    timeout: 10000
- assertVisible: 'Your drafts.*Only you can see it'
- assertVisible:
    id: 'draft-continue-.*'
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: autosave-drafts-panel
# 3. Continue it, then post it. The flow opens on the write-up, the words as they were kept.
- tapOn:
    id: 'draft-continue-.*'
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*What was planned\?.*'
    timeout: 15000
- assertVisible: 'Finish this draft'
- assertVisible: 'Step 3 of 6'
- assertNotVisible:
    id: record-money
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: record-planned
          text: 'Autosaved from the phone'
- tapOn:
    id: step-flow-next
- tapOn:
    id: step-flow-next
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-next
      text: 'Post session'
    timeout: 10000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible: 'Session recorded. Everyone concerned can see it now.'
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: drafts-panel
    timeout: 10000
- extendedWaitUntil:
    visible: 'Autosaved from the phone'
    timeout: 15000
- takeScreenshot: autosave-posted
# Put the data back: delete the lesson from its detail.
# The "Session recorded." toast sits over the list's foot, right above the bar's hump, where the
# new lesson's notes line lands: bring the card to mid-screen before tapping it.
- scrollUntilVisible:
    element: 'Autosaved from the phone'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: 'Autosaved from the phone'
- scrollUntilVisible:
    element:
      id: session-delete
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: session-delete
- extendedWaitUntil:
    visible: 'Delete this session?'
    timeout: 10000
- tapOn: 'Delete'
- extendedWaitUntil:
    visible: 'Session deleted.'
    timeout: 15000
