# A draft is its author's alone (R10). Alex saves a write-up with Sofia as a draft (Save draft, the
# explicit, logged save). Maria -- a tutor and Sofia's own parent -- and Priya, the admin, see no
# Drafts panel. Alex discards it, with a confirmation, and the panel goes. Phase 75 (JF30): the record is
# "Another lesson" from the lessons still owed, dated by hand (nothing by default); a draft's own action is
# Record (one verb), never "Post".
appId: ${APP_ID}
# Self-cleaning: leftover lessons, drafts and running lessons from any earlier run (even a failed
# one) are removed before this flow, and whatever this flow leaves is removed after it.
onFlowStart:
  - runScript: ../../scripts/clean-sessions.js
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`.
- tapOn:
    id: tab-sessions
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 20000
# Record a lesson is a step flow (UI upgrades U4): Sofia, then the Planned card.
- runFlow:
    file: ../../subflows/record-lesson-start.yaml
    env:
      PAIRING: a0000000-0000-4000-8000-000000000001
- tapOn:
    id: record-planned
- inputText: 'Private draft from Alex'
# Return closes the keyboard on the short parts of the write-up.
- pressKey: Enter
# Save draft: the explicit, logged save, at the top of the flow.
- tapOn:
    id: record-save-draft
- extendedWaitUntil:
    visible: 'Saved as a draft. Only you can see it.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: drafts-panel
    timeout: 10000
# The panel sits under To record (Phase 75): bring its actions to mid-screen, off the tab bar.
- scrollUntilVisible:
    element:
      id: 'draft-post-.*'
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: 'Sofia Okafor'
- assertVisible:
    id: 'draft-post-.*'
    text: '.*Record.*'
- assertNotVisible: 'Post'
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: drafts-alex
# Maria (Sofia's parent, and a tutor) never sees it.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: maria.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`.
- tapOn:
    id: tab-sessions
# Loaded: the lessons are there (under To record and the totals since Phase 75) ...
- scrollUntilVisible:
    element:
      id: 'session-card-.*'
    direction: DOWN
    timeout: 20000
# ... and back to the totals, with the place a Drafts panel would take (just above them) on screen.
- scrollUntilVisible:
    element:
      id: stat-sessions
    direction: UP
    centerElement: true
    timeout: 20000
- assertNotVisible:
    id: drafts-panel
- assertNotVisible: 'Private draft from Alex'
# Nor does the office.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`.
- tapOn:
    id: tab-sessions
# Loaded: the lessons are there (under To record and the totals since Phase 75) ...
- scrollUntilVisible:
    element:
      id: 'session-card-.*'
    direction: DOWN
    timeout: 20000
# ... and back to the totals, with the place a Drafts panel would take (just above them) on screen.
- scrollUntilVisible:
    element:
      id: stat-sessions
    direction: UP
    centerElement: true
    timeout: 20000
- assertNotVisible:
    id: drafts-panel
# Alex discards it.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`.
- tapOn:
    id: tab-sessions
- extendedWaitUntil:
    visible:
      id: drafts-panel
    timeout: 20000
# The panel sits under To record (Phase 75): bring the discard to mid-screen, off the tab bar.
- scrollUntilVisible:
    element:
      id: 'draft-discard-.*'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'draft-discard-.*'
- extendedWaitUntil:
    visible: 'Discard this draft?'
    timeout: 10000
- assertVisible: 'Keep it'
- tapOn: 'Discard'
- extendedWaitUntil:
    visible: 'Draft discarded.'
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: drafts-panel
    timeout: 10000
