# A live lesson (Alex, tutor in chmi), in the app and on the system's surface (#45). He starts one with Sofia from the Sessions tab; the banner
# floats above the tab bar with the stopwatch ticking from the server's start, "from" and "ends
# by", and no money. It follows him to Home and Schedule. Stop with a note: the toast says the
# times and the LENGTH, never the pay, and the lesson is in the list. A second one is discarded
# with a confirmation. The recorded lesson is deleted at the end, so other flows see the seed.
# Phase 75 (JF18, JF30): "lesson" on every surface; a running lesson leads Home's Next up, with Stop; Start from the
# home's quick action while one runs says which and offers to stop it; "Keep going" keeps a typed note.
appId: ${APP_ID}
# Self-cleaning: leftover lessons, drafts and running lessons from any earlier run (even a failed
# one) are removed before this flow, and whatever this flow leaves is removed after it.
onFlowStart:
  - runScript: ../../scripts/clean-sessions.js
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`.
- tapOn:
    id: tab-sessions
- extendedWaitUntil:
    visible:
      id: sessions-start
    timeout: 20000
- assertNotVisible:
    id: live-banner
- tapOn:
    id: sessions-start
- extendedWaitUntil:
    visible:
      id: start-student-00000000-0000-4000-8000-000000000008
    timeout: 15000
- assertVisible: 'Start a lesson'
- assertNotVisible: '.*\$[0-9].*'
- tapOn:
    id: start-student-00000000-0000-4000-8000-000000000008
- tapOn:
    id: start-mode-virtual
- tapOn:
    id: start-submit
- extendedWaitUntil:
    visible: 'Lesson started.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: live-banner
    timeout: 10000
- assertVisible:
    id: live-student
    text: 'Sofia Okafor.*Virtual'
- assertVisible:
    id: live-from
    text: 'from [0-9]{1,2}:[0-9]{2} (AM|PM).*'
- assertVisible:
    id: live-ends-by
    text: 'ends by [0-9]{1,2}:[0-9]{2} (AM|PM)'
# The stopwatch ticks, from the server's start instant.
- extendedWaitUntil:
    visible:
      id: live-stopwatch
      text: '0:00:(0[3-9]|[1-5][0-9])'
    timeout: 15000
- assertNotVisible:
    id: sessions-start
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: live-banner-sessions
# The system surface: the notification on Android (its words, and no name), the readout on both.
- runFlow:
    file: ../../subflows/live-surface-shade.yaml
    env:
      SHOT: live-surface-shade
- runFlow:
    file: ../../subflows/live-surface-state.yaml
    env:
      STATE: showing
- extendedWaitUntil:
    visible:
      id: live-banner
    timeout: 10000
# It follows him around the app.
- tapOn: 'Home'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertVisible:
    id: live-banner
# Next up leads with the lesson under way, and its Stop (no money).
- extendedWaitUntil:
    visible:
      id: next-up-lesson_running
    timeout: 15000
- assertVisible: 'Your lesson with Sofia is running\.'
- assertVisible:
    id: next-up-detail
    text: 'Running [0-9]+ min · Virtual'
- assertNotVisible:
    id: next-up-later
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: live-next-up-running
# Start while one runs: the sheet says which, and offers to stop it.
- runFlow:
    when:
      visible:
        id: quick-start_lesson
    commands:
      - tapOn:
          id: quick-start_lesson
      - extendedWaitUntil:
          visible:
            id: start-running
          timeout: 15000
      - assertVisible: 'Your lesson with Sofia Okafor is still running\. Stop it before starting another\.'
      - assertVisible:
          id: start-stop-running
      - assertNotVisible:
          id: start-submit
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: start-cancel
      - extendedWaitUntil:
          visible:
            id: screen-home
          timeout: 10000
- takeScreenshot: live-banner-home
- runFlow: ../../subflows/open-schedule.yaml
- extendedWaitUntil:
    visible:
      id: live-banner
    timeout: 10000
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`.
- tapOn:
    id: tab-sessions
- extendedWaitUntil:
    visible:
      id: live-stop
    timeout: 10000
# Stop, with a note.
- tapOn:
    id: live-stop
- extendedWaitUntil:
    visible:
      id: stop-notes
    timeout: 15000
- assertVisible: 'End the lesson with Sofia Okafor\?'
- assertNotVisible: '.*\$[0-9].*'
- tapOn:
    id: stop-notes
- inputText: 'Stopped from the phone'
# A tap on the heading closes the keyboard.
- tapOn: 'End the lesson with Sofia Okafor\?'
# "Keep going" keeps the note on the running lesson: the sheet opens on it again.
- tapOn:
    id: stop-keep-going
- extendedWaitUntil:
    notVisible:
      id: stop-notes
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: live-stop
- extendedWaitUntil:
    visible:
      id: stop-notes
      text: '.*Stopped from the phone.*'
    timeout: 15000
- tapOn:
    id: stop-submit
- extendedWaitUntil:
    visible: 'Lesson recorded: .*, [0-9]+ (min|hr).*\.'
    timeout: 15000
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: live-stopped
- extendedWaitUntil:
    notVisible:
      id: live-banner
    timeout: 10000
# The lesson list sits below To record now: scroll to the note.
- scrollUntilVisible:
    element: 'Stopped from the phone'
    timeout: 20000
# Stopped: the system surface is gone too.
- runFlow:
    file: ../../subflows/live-surface-state.yaml
    env:
      STATE: none
# Start again, and discard it. The page kept its place by the note: back up to Start a lesson.
- scrollUntilVisible:
    element:
      id: sessions-start
    direction: UP
    timeout: 20000
# Let the stop sheet finish sliding away first.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: sessions-start
- extendedWaitUntil:
    visible:
      id: start-student-00000000-0000-4000-8000-000000000008
    timeout: 15000
- tapOn:
    id: start-student-00000000-0000-4000-8000-000000000008
- tapOn:
    id: start-submit
- extendedWaitUntil:
    visible:
      id: live-cancel
    timeout: 15000
- tapOn:
    id: live-cancel
- extendedWaitUntil:
    visible: 'Discard this lesson?'
    timeout: 10000
- assertVisible: 'Keep going'
- tapOn: 'Discard'
- extendedWaitUntil:
    visible: 'Lesson discarded.'
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: live-banner
    timeout: 10000
- assertVisible:
    id: sessions-start
# Discarded: no system surface either.
- runFlow:
    file: ../../subflows/live-surface-state.yaml
    env:
      STATE: none
# The lesson list sits below To record now: scroll to the note.
- scrollUntilVisible:
    element: 'Stopped from the phone'
    timeout: 20000
# Put the data back: delete the recorded lesson from its detail.
- tapOn: 'Stopped from the phone'
- scrollUntilVisible:
    element:
      id: session-delete
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: session-delete
- extendedWaitUntil:
    visible: 'Delete this lesson?'
    timeout: 10000
- tapOn: 'Delete'
- extendedWaitUntil:
    visible: 'Lesson deleted.'
    timeout: 15000
