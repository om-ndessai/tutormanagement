# A tutor records a lesson from the create button (Alex, tutor in chmi), a step flow (UI upgrades
# U4): Student, When, then the write-up cards. It shows the length and never a figure. Next with no
# student says why. He records a lesson with Ben (an hour and a half, notes, homework done, a goal
# rating and his own assessment); it is in the list; he edits it on the record sheet (editing stays
# the full form), then deletes it, which also puts the data back for other flows.
appId: ${APP_ID}
# Self-cleaning: leftover lessons, drafts and running lessons from any earlier run (even a failed
# one) are removed before this flow, and whatever this flow leaves is removed after it.
onFlowStart:
  - runScript: ../../scripts/clean-sessions.js
onFlowComplete:
  - runScript: ../../scripts/clean-sessions.js
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'Sessions'
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 20000
- assertVisible:
    id: sessions-record-button
# Recording is the tab bar's create button, and a step flow (UI upgrades U2, U4).
- tapOn:
    id: create-button
- tapOn:
    id: create-action-record-session
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who was the lesson with\?.*'
    timeout: 15000
- assertVisible: 'Record a lesson'
- assertVisible: 'Step 1 of 6'
- assertNotVisible:
    id: record-money
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: record-step-student
# Taps during the rise are not delivered (iOS, U3).
- waitForAnimationToEnd:
    timeout: 3000
# No student chosen: Next is refused, and the step says why.
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: record-student-error
      text: 'Choose which student this session was with.'
    timeout: 10000
- assertVisible: 'Step 1 of 6'
# Only his own pairings: Ben, never another tutor's students.
- assertNotVisible:
    id: record-student-row-a0000000-0000-4000-8000-000000000004
- tapOn:
    id: record-student-row-a0000000-0000-4000-8000-000000000002
- assertNotVisible:
    id: record-student-error
- tapOn:
    id: step-flow-next
# When: an hour and a half, in one tap. The length, never a figure.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*When was it\?.*'
    timeout: 10000
- tapOn:
    id: record-length-90
- assertVisible:
    id: record-preview
- assertVisible: '1 hr 30 min'
- assertNotVisible:
    id: record-money
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: record-step-when
- tapOn:
    id: step-flow-next
# The write-up: four optional cards. Planned is skipped.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*What was planned\?.*'
    timeout: 10000
- assertVisible:
    id: dictate-record-planned
    text: '.*Dictate.*'
- takeScreenshot: record-step-planned
- tapOn:
    id: step-flow-skip
# Covered: the notes.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*What was covered\?.*'
    timeout: 10000
- tapOn:
    id: record-notes
- inputText: 'Recorded from the phone: long division'
- hideKeyboard
- tapOn:
    id: step-flow-next
# Homework: last time's was done.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Homework.*'
    timeout: 10000
- tapOn:
    id: record-homework-done
- tapOn:
    id: step-flow-next
# Progress: a goal rating and his own view of the lesson.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Progress.*'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: record-goal-3
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: record-goal-3
- scrollUntilVisible:
    element:
      id: record-assessment-4
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: record-assessment-4
- assertVisible: 'Went well'
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: record-filled
- assertVisible:
    id: step-flow-next
    text: 'Record lesson'
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible: 'Session recorded.'
    timeout: 15000
# It leads the list (today is the newest day), with its notes.
- extendedWaitUntil:
    visible: 'Recorded from the phone: long division'
    timeout: 15000
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: record-in-list
- tapOn: 'Recorded from the phone: long division'
- extendedWaitUntil:
    visible:
      id: session-edit
    timeout: 15000
- assertVisible: 'Homework: done'
# Edit: the sheet starts from the lesson; the homework set is added.
- tapOn:
    id: session-edit
- extendedWaitUntil:
    visible: 'Edit session'
    timeout: 15000
- assertNotVisible:
    id: record-pairing
- assertNotVisible: '.*\$[0-9].*'
# A part left empty when it was recorded (typing into an empty field: the cursor is at its end).
- scrollUntilVisible:
    element:
      id: record-homework-set
    direction: DOWN
    centerElement: true
- tapOn:
    id: record-homework-set
- inputText: 'Edited from the phone: five problems'
# Return puts the keyboard away (Maestro's hideKeyboard fails on iOS in a form sheet).
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: record-submit
    direction: DOWN
    timeout: 20000
- assertVisible: 'Save changes'
- tapOn:
    id: record-submit
- extendedWaitUntil:
    visible: 'Session updated.'
    timeout: 15000
- extendedWaitUntil:
    visible: 'Edited from the phone: five problems'
    timeout: 15000
- takeScreenshot: record-edited
# Delete, from the detail, with a confirmation.
- scrollUntilVisible:
    element:
      id: session-delete
    direction: DOWN
    centerElement: true
- tapOn:
    id: session-delete
- extendedWaitUntil:
    visible: 'Delete this session?'
    timeout: 10000
- assertVisible: '.*will be removed\. This cannot be undone\.'
- assertNotVisible: '.*\$[0-9].*'
- tapOn: 'Delete'
- extendedWaitUntil:
    visible: 'Session deleted.'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
- assertNotVisible: 'Recorded from the phone.*'
# Recording consumed the draft the sheet autosaved on the way: none is left behind.
- assertNotVisible:
    id: drafts-panel
