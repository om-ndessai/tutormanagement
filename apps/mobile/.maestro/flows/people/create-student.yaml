# The office adds a child whose parent is on file (Priya), family first (UI upgrades U3): the Add a
# student flow opens on the family; Next is refused until a guardian is chosen (the API's guardian
# rule, said before the server does); Anita Patel is found by search, her row naming her children,
# and chosen as Mother. Then the student -- a name, no email, since a child who never signs in needs
# none -- the two optional steps skipped, the lessons and the price left as they are, the Review, and Add:
# the student and the link are created in ONE request. What next offers the assessment, the plan
# and a tutor; Open their record shows her as the primary contact. Cleans up after itself.
appId: ${APP_ID}
# Self-cleaning: people an earlier run created (even a failed one) are removed before this flow,
# and whatever this flow creates or changes is put back after it.
onFlowStart:
  - runScript: ../../scripts/clean-people.js
onFlowComplete:
  - runScript: ../../scripts/clean-people.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn:
    id: create-button
- extendedWaitUntil:
    visible:
      id: create-action-add-student
    timeout: 10000
- tapOn:
    id: create-action-add-student
# The family comes first.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who is their family\?.*'
    timeout: 15000
- assertVisible: 'Step 1 of 7'
- assertVisible:
    id: add-student-new-parent
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible: 'A student must have at least one parent or guardian.'
    timeout: 5000
- assertVisible: 'Step 1 of 7'
- takeScreenshot: add-student-family-refused
- tapOn:
    id: add-student-parents-input
- inputText: 'Anita'
- extendedWaitUntil:
    visible:
      id: add-student-parents-row-00000000-0000-4000-8000-000000000007
    timeout: 15000
# Her row says whose parent she is (or her email, for a parent with no child yet).
- assertVisible: 'Anita Patel, Parent of .*'
- tapOn:
    id: add-student-parents-row-00000000-0000-4000-8000-000000000007
- extendedWaitUntil:
    visible:
      id: guardian-00000000-0000-4000-8000-000000000007
    timeout: 10000
- assertNotVisible: 'A student must have at least one parent or guardian.'
# The only guardian is the primary contact: nothing to choose.
- assertNotVisible:
    id: guardian-00000000-0000-4000-8000-000000000007-primary
- tapOn:
    id: guardian-00000000-0000-4000-8000-000000000007-rel-mother
- takeScreenshot: add-student-family
- hideKeyboard
- tapOn:
    id: step-flow-next
# The student.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who is the student\?.*'
    timeout: 5000
- assertVisible: 'Only if they will sign in themselves.*'
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible: 'Name is required.'
    timeout: 5000
- tapOn:
    id: add-student-name
- inputText: 'Mila Novak'
- assertNotVisible: 'Name is required.'
- hideKeyboard
- tapOn:
    id: step-flow-next
# Both optional steps, skipped.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*School and goal.*'
    timeout: 5000
- tapOn:
    id: step-flow-skip
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*When can they learn\?.*'
    timeout: 5000
- tapOn:
    id: step-flow-skip
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Their lessons.*'
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*The price.*'
    timeout: 5000
- assertVisible:
    id: person-student-price-in-person
- tapOn:
    id: step-flow-next
# The Review, then Add.
- extendedWaitUntil:
    visible:
      id: step-flow-review
    timeout: 5000
- assertVisible: 'Anita Patel — Mother'
- assertVisible: 'Mila Novak'
- assertVisible: 'No email'
- takeScreenshot: add-student-review
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: add-person-done
    timeout: 15000
- assertVisible: 'Mila Novak is added'
- assertVisible:
    id: add-person-done-assess
- assertVisible:
    id: add-person-done-plan
- assertVisible:
    id: add-person-done-pair
- takeScreenshot: add-student-done
- tapOn:
    id: add-person-done-record
- extendedWaitUntil:
    visible:
      id: person-name
    timeout: 15000
- assertVisible: 'Mila Novak'
- assertVisible: 'No email'
- assertNotVisible:
    id: person-email-action
- scrollUntilVisible:
    element:
      id: person-guardian-00000000-0000-4000-8000-000000000007
    direction: DOWN
    timeout: 20000
- assertVisible: 'Anita Patel, Mother, Primary contact.*'
