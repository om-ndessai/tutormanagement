# Smoke (Phase 38): the Assessment menu on the main path, in seconds. Priya (admin, chmi) opens it
# from More; the start card shows, and the levels come from the API (G4 has questions). The list of
# levels scrolls within itself down to the AoPS ones (22 levels since 2026-10-22, more than fit). Starts
# nothing, changes nothing.
appId: ${APP_ID}
tags:
  - smoke
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- tapOn: 'More'
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- scrollUntilVisible:
    element:
      id: more-nav-assessments
    centerElement: true
- tapOn:
    id: more-nav-assessments
- extendedWaitUntil:
    visible:
      id: assessment-start
    timeout: 15000
- tapOn:
    id: assessment-level
- extendedWaitUntil:
    visible:
      id: assessment-level-list
    timeout: 15000
# NC 2026 starts at Kindergarten (2026-10-22): G4 is the fifth row, below the fold on a phone.
- scrollUntilVisible:
    element:
      id: assessment-level-NC26.4
    direction: DOWN
    speed: 30
    visibilityPercentage: 100
    timeout: 20000
- assertVisible:
    id: assessment-level-NC26.4
    text: 'G4 .*10 questions.*'
# The list scrolls: swipes inside it reach AoPS Algebra, the 21st of 22 (chmi offers Beast Academy).
- repeat:
    while:
      notVisible:
        id: assessment-level-ALG
    times: 10
    commands:
      - swipe:
          from:
            id: assessment-level-list
          direction: UP
- assertVisible:
    id: assessment-level-ALG
    text: 'AoPS Algebra.*'
