# The organization picker: someone in two organizations chooses, stars a default (and clears
# it), and enters one -- which then wears that organization's brand.
appId: ${APP_ID}
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: ""
- extendedWaitUntil:
    visible:
      id: screen-select-organization
    timeout: 20000
- assertVisible:
    id: org-chmi
- assertVisible:
    id: org-riverside
- assertVisible: "Star one to land in it whenever you sign in."
# Star a default, then clear it again (the seed has none).
- tapOn:
    id: org-default-riverside
- extendedWaitUntil:
    visible: "You will land in Riverside Tutoring when you sign in."
    timeout: 10000
- assertVisible: "Default"
- tapOn:
    id: org-default-riverside
- extendedWaitUntil:
    visible: "You will choose where to go when you sign in."
    timeout: 10000
# Enter one.
- tapOn:
    id: org-chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
