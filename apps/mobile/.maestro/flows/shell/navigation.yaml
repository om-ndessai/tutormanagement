# The app shell: the same tabs for everyone (Home, Sessions, Progress, More), the create button in
# the bar's hump for anyone with something to create (UI upgrades U2, revised 2026-10-15; its sheet
# is shell/create), Schedule inside Sessions behind Lessons | Schedule, More reaching every other
# page, the account sheet with appearance and the organization switcher (whose switch rebrands the
# app).
appId: ${APP_ID}
tags:
  - smoke
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertVisible:
    id: create-button
- takeScreenshot: shell-home
- tapOn: 'Sessions'
- assertVisible:
    id: screen-sessions
# Schedule lives inside Sessions (the tab bar, revised 2026-10-15): Lessons | Schedule heads both,
# and the Sessions tab brings Lessons back.
- tapOn:
    id: sessions-switch-schedule
- extendedWaitUntil:
    visible:
      id: screen-schedule
    timeout: 10000
- assertNotVisible:
    id: tab-schedule
- takeScreenshot: shell-schedule
- tapOn:
    id: sessions-switch-lessons
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
- tapOn:
    id: sessions-switch-schedule
- extendedWaitUntil:
    visible:
      id: screen-schedule
    timeout: 10000
- tapOn:
    id: tab-sessions
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
- tapOn: 'Progress'
- assertVisible:
    id: screen-progress
- tapOn: 'More'
- assertVisible:
    id: screen-more
- assertVisible: 'Organization'
- takeScreenshot: shell-more
- tapOn:
    id: more-nav-billing
- assertVisible:
    id: screen-billing
- runFlow: ../../subflows/go-back.yaml
- assertVisible:
    id: screen-more
# Phase 43: the Analytics figures left Home for More → Dashboard.
- tapOn:
    id: more-nav-analytics
- extendedWaitUntil:
    visible:
      id: screen-dashboard-analytics
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: stat-students
    timeout: 20000
- runFlow: ../../subflows/go-back.yaml
- assertVisible:
    id: screen-more
- tapOn: 'Home'
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-org-riverside
- takeScreenshot: shell-account
- tapOn:
    id: account-org-riverside
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
- tapOn:
    id: account-button
- assertVisible: 'Tutor at Riverside'
