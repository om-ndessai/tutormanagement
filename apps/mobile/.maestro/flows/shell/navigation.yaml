# The app shell: the same tabs for everyone (Home, Sessions, Progress, More), the create button in
# the bar's hump for anyone with something to create (UI upgrades U2, revised 2026-10-15; its sheet
# is shell/create), Schedule inside Sessions behind Lessons | Schedule, More reaching every other
# page, the account sheet with appearance and the organization switcher (whose switch rebrands the
# app). Phase 79 (M6): a member (no role, made through the API) has Home and More only, no (+), and a More without the
# teaching pages; home/member-home-member walks the rest of their home.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/clean-people.js
  - runScript:
      file: ../../scripts/spaces.js
      env:
        ACTION: add-person
        EMAIL: members.nav@example.com
        NAME: Nia Member
        ROLES: member
        ACTOR: priya.raghavan@gmail.com
        ORG: chmi
onFlowComplete:
  - runScript: ../../scripts/clean-people.js
tags:
  - smoke
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertVisible:
    id: create-button
- takeScreenshot: shell-home
# Phase 78: the tab reads "Lessons" (the glossary); its testID keeps `sessions`, and no tab says Sessions.
- assertVisible:
    id: tab-sessions
    text: 'Lessons'
- assertNotVisible: 'Sessions'
- tapOn:
    id: tab-sessions
- assertVisible:
    id: screen-sessions
# Schedule lives inside Lessons (the tab bar, revised 2026-10-15): Lessons | Schedule heads both,
# and the Lessons tab brings the lessons back.
- tapOn:
    id: sessions-switch-schedule
- extendedWaitUntil:
    visible:
      id: screen-schedule
    timeout: 10000
- assertNotVisible:
    id: tab-schedule
- takeScreenshot: shell-schedule
- tapOn:
    id: sessions-switch-lessons
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
- tapOn:
    id: sessions-switch-schedule
- extendedWaitUntil:
    visible:
      id: screen-schedule
    timeout: 10000
- tapOn:
    id: tab-sessions
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 10000
- tapOn: 'Progress'
- assertVisible:
    id: screen-progress
- tapOn: 'More'
- assertVisible:
    id: screen-more
# "Space settings" since UI audit JF7 (it was "Space").
- assertVisible: 'Space settings'
- takeScreenshot: shell-more
- tapOn:
    id: more-nav-billing
- assertVisible:
    id: screen-billing
- runFlow: ../../subflows/go-back.yaml
- assertVisible:
    id: screen-more
# Phase 43: the Analytics figures left Home for More → Dashboard.
- tapOn:
    id: more-nav-analytics
- extendedWaitUntil:
    visible:
      id: screen-dashboard-analytics
    timeout: 10000
# Phase 74 (JF24): it opens on the hat her home leads with (her teaching on a lesson day); the office's figures here.
- extendedWaitUntil:
    visible:
      id: dashboard-role-admin
    timeout: 15000
- tapOn:
    id: dashboard-role-admin
- extendedWaitUntil:
    visible:
      id: stat-students
    timeout: 20000
- runFlow: ../../subflows/go-back.yaml
- assertVisible:
    id: screen-more
- tapOn: 'Home'
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-org-riverside
- takeScreenshot: shell-account
- tapOn:
    id: account-org-riverside
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
- tapOn:
    id: account-button
- assertVisible: 'Tutor at Riverside'

# --- Phase 79 (M6): a member's shell -- Home and More, no (+), no teaching pages ---------------------------------
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: members.nav@example.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertVisible:
    id: tab-dashboard
- assertVisible:
    id: tab-more
- assertNotVisible:
    id: tab-sessions
- assertNotVisible:
    id: tab-progress
- assertNotVisible:
    id: create-button
# chmi has Question Quest's switch off in the seed (quest-start.js turns it on for a flow), and a member has nobody to
# assess: their home says only Quest is off -- Assessment is on there, just not for them (the web's words).
- extendedWaitUntil:
    visible:
      id: home-learner-empty
      text: 'Nothing to play here yet: Quest is off in this space\.'
    timeout: 15000
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
# Activity and My profile; Quest only where its set is on (home/member-home-member switches it on), as for everyone.
- assertVisible:
    id: more-nav-activity
- assertVisible:
    id: more-nav-profile
- assertNotVisible:
    id: more-nav-quest
- assertNotVisible:
    id: more-nav-analytics
- assertNotVisible:
    id: more-nav-schedule
- assertNotVisible:
    id: more-nav-comments
- takeScreenshot: shell-member-more
