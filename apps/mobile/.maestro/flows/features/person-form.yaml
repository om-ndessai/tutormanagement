# Phase 50: the person form without Tutoring. Ines (`assess`), More → Users, then the "+" → Add someone
# else: no Tutor role; ticking Student shows no charge rate or session limit. The Users filter has
# no Tutor chip. Unsaved.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/reset-features.js
onFlowComplete:
  - runScript: ../../scripts/reset-features.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: ines.ferreira.assess@gmail.com
      ORG: assess
- extendedWaitUntil:
    visible:
      id: space-home
    timeout: 30000
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- tapOn:
    id: more-nav-users
- extendedWaitUntil:
    visible:
      id: screen-people
    timeout: 15000
- assertVisible:
    id: people-role-all
- assertNotVisible:
    id: people-role-tutor
- takeScreenshot: features-people
# Users is pushed over the tabs; the bar's "+" is back on More.
- runFlow: ../../subflows/go-back.yaml
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- tapOn:
    id: create-button
- extendedWaitUntil:
    visible:
      id: create-sheet
    timeout: 10000
- tapOn:
    id: create-action-add-person
- extendedWaitUntil:
    visible:
      id: person-role-student
    timeout: 15000
- assertNotVisible:
    id: person-role-tutor
- tapOn:
    id: person-role-student
- assertNotVisible:
    id: person-student-limit
- takeScreenshot: features-person-form
- runFlow:
    file: ../../subflows/dismiss-sheet.yaml
    env:
      SHEET: screen-person-form
- runFlow:
    when:
      visible: 'Discard changes\?'
    commands:
      - tapOn: 'Discard'
