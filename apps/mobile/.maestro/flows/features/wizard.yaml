# Phase 50: the welcome wizard in a space without Tutoring. Ines (`assess`, a fresh device): it does not
# open by itself there (owner, 2026-11-04); opened from its link, the welcome offers Add a student and no Add a tutor; the student flow's steps are the family and the
# student, then Start an assessment (no Assessment, plan or tutor steps); Add the student opens the
# add-student flow with four steps -- family, student, school, the review. Closed unsaved.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/reset-features.js
onFlowComplete:
  - runScript: ../../scripts/reset-features.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: ines.ferreira.assess@gmail.com
      ORG: assess
      FRESH: '1'
# Owner, 2026-11-04: the wizard and the tour are Tutoring's (`tourOffered`): here it never opens by
# itself, and neither the account menu nor Search offers the tour. Its no-Tutoring variant is still
# checked, opened from its link.
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: screen-onboarding
- assertNotVisible:
    id: tour-offer
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
# Phase 72 put Join with a code and Start a space under the spaces: My profile is further down.
- scrollUntilVisible:
    element:
      id: account-profile
- assertNotVisible:
    id: account-tour
- runFlow:
    file: ../../subflows/dismiss-sheet.yaml
    env:
      SHEET: screen-account
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: aimtrue://onboarding
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 15000
- assertVisible:
    id: onboarding-choice-student
- assertNotVisible:
    id: onboarding-choice-tutor
- takeScreenshot: features-wizard-welcome
- tapOn:
    id: onboarding-choice-student
- extendedWaitUntil:
    visible:
      id: student-flow-student
    timeout: 10000
- assertVisible:
    id: flow-step-student
- assertVisible:
    id: flow-step-start
- assertNotVisible:
    id: flow-step-assessment
- takeScreenshot: features-wizard-student
- tapOn:
    id: student-flow-add-student
# Phase 74 (JF31): no Tutoring here, so nobody is billed -- the family step asks who looks after the student.
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who looks after this student\?.*'
    timeout: 15000
- assertVisible: 'Step 1 of 4'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: step-flow-close
- extendedWaitUntil:
    visible:
      id: student-flow-student
    timeout: 10000
