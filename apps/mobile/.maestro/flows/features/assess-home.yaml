# Phase 50, the main path: a space allowed Assessment alone. Ines (admin and parent, `assess`) lands
# on the member home (Phase 66) -- with the Assessment home -- with Home and More alone in the bar, a menu without
# anything of Tutoring's or Quest's, and a create sheet of Start an assessment and adding people.
# Changes nothing.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/reset-features.js
onFlowComplete:
  - runScript: ../../scripts/reset-features.js
tags:
  - smoke
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: ines.ferreira.assess@gmail.com
      ORG: assess
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# Phase 66: the member home; the Assessment home is in Ines's "Your learning" -- since Phase 74 (JF6) after her
# child's card and the office (what she came for leads), so it is scrolled to -- to the middle, as its rows follow it and
# the heading alone can sit just above the tab bar (it does once the office has an assessment to review, as after
# canvas-assessments/hand-over).
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 15000
- scrollUntilVisible:
    element:
      id: assess-home-students
    centerElement: true
    timeout: 15000
- assertVisible:
    id: 'assess-home-student-.*'
- scrollUntilVisible:
    element:
      id: assess-home-waiting
    centerElement: true
- scrollUntilVisible:
    element:
      id: assess-home-recent
    centerElement: true
- takeScreenshot: features-assess-home
# The bar: Home and More, the "+" between them.
- assertVisible:
    id: tab-dashboard
- assertVisible:
    id: tab-more
- assertNotVisible:
    id: tab-sessions
- assertNotVisible:
    id: tab-progress
# The create sheet.
- tapOn:
    id: create-button
- extendedWaitUntil:
    visible:
      id: create-sheet
    timeout: 10000
- assertVisible:
    id: create-action-start-assessment
# Phase 76 (JF21): one "Add people" row, the one Add chooser -- never separate student / tutor / someone rows.
- assertVisible:
    id: create-action-add-people
- assertNotVisible:
    id: create-action-add-student
- assertNotVisible:
    id: create-action-add-person
- assertNotVisible:
    id: create-action-record-session
- assertNotVisible:
    id: create-action-add-tutor
- takeScreenshot: features-create-sheet
- runFlow:
    when:
      platform: Android
    commands:
      - back
# On iOS, the backdrop above the sheet closes it (pressBehavior "close"). A swipe sent while the sheet
# was still rising was sometimes dropped, leaving it open (2026-10-29).
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: 50%, 8%
- extendedWaitUntil:
    notVisible:
      id: create-sheet
    timeout: 10000
# More: the menu follows the sets.
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- assertVisible:
    id: more-nav-assessments
- assertVisible:
    id: more-nav-users
- scrollUntilVisible:
    element:
      id: more-nav-organization
    centerElement: true
- assertVisible:
    id: more-nav-activity
- assertNotVisible:
    id: more-nav-billing
- assertNotVisible:
    id: more-nav-assignments
- assertNotVisible:
    id: more-nav-comments
- assertNotVisible:
    id: more-nav-analytics
- assertNotVisible:
    id: more-nav-locations
- assertNotVisible:
    id: more-nav-quest
- takeScreenshot: features-more
