# A tutor's own Finance tab (Alex, tutor in chmi, on an advance, no SSN on file): the SSN
# notice first, his earnings labelled from his side, his month by month and the payments to
# him -- and none of the organization's figures. Back on Tutoring, no money.
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: dashboard-section-analytics
    timeout: 30000
- tapOn:
    id: tabs-finance
- extendedWaitUntil:
    visible:
      id: dashboard-finance-tutor
    timeout: 10000
- assertVisible:
    id: tutor-ssn-notice
- assertVisible: 'Action needed: your SSN'
- assertVisible:
    id: stat-earned
    text: 'Earned: \$[0-9,]+\.[0-9]{2}'
- assertVisible:
    id: stat-paid-to-you
    text: 'Paid to you: \$[0-9,]+\.[0-9]{2}'
- assertVisible:
    id: stat-owed-to-you
    text: 'Owed to you: \$[0-9,]+\.[0-9]{2}.*'
- assertVisible:
    id: stat-advance-held
    text: 'Advance held: \$[0-9,]+\.[0-9]{2}\. .*'
- takeScreenshot: finance-tutor-top
# Never the organization's side.
- assertNotVisible: '.*Owed by families.*'
- assertNotVisible: '.*Owed to tutors.*'
- assertNotVisible: '.*Kept by.*'
- assertNotVisible: '.*Billed all time.*'
- assertNotVisible:
    id: tutor-payments
- scrollUntilVisible:
    element:
      id: monthly-finance-year
    direction: DOWN
    timeout: 30000
- assertNotVisible: '.*Billed \$.*'
- assertNotVisible: '.*Received \$.*'
- assertVisible: '.*Paid to you \$.*'
- takeScreenshot: finance-tutor-monthly
- scrollUntilVisible:
    element:
      id: tutor-payments-to-you-action
    direction: DOWN
- assertVisible: 'Payments to you'
- assertNotVisible:
    id: year-end
- assertNotVisible:
    id: ssn-panel
- assertNotVisible:
    id: family-balances
- assertNotVisible: '.*Year-end documents.*'
- takeScreenshot: finance-tutor-bottom
- scrollUntilVisible:
    element:
      id: tabs-tutoring
    direction: UP
    timeout: 60000
- tapOn:
    id: tabs-tutoring
- extendedWaitUntil:
    visible:
      id: dashboard-section-analytics
    timeout: 10000
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
