# A student's dashboard (Sofia): her progress, her tutors and her lessons -- and no money at all,
# though the server prices a student's own lessons from the family's side.
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: sofia.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: dashboard-student
    timeout: 30000
- assertNotVisible:
    id: tabs-finance
- assertVisible:
    id: stat-sessions
- assertVisible:
    id: stat-time-tutored
- assertVisible:
    id: stat-tutors
# UI upgrades U6: the greeting and Today first, then her own card: the next lesson and this month.
- assertVisible:
    id: home-greeting
    text: 'Good (morning|afternoon|evening), Sofia'
- assertVisible:
    id: home-today
- assertVisible:
    id: home-child-00000000-0000-4000-8000-000000000008
# The card is one link for a screen reader: its label says whose it is.
- assertVisible:
    id: home-child-00000000-0000-4000-8000-000000000008-open
    text: 'Your progress\..*'
- assertVisible:
    id: home-child-00000000-0000-4000-8000-000000000008-next
    text: '(Next: .*|Under way now) with Alex Chen'
- assertNotVisible: '.*\$[0-9].*'
- takeScreenshot: student-top
- scrollUntilVisible:
    element:
      id: progress-card-00000000-0000-4000-8000-000000000008
    direction: DOWN
    timeout: 30000
- assertVisible: 'Your progress'
- assertNotVisible: '.*\$[0-9].*'
# Centred: the card above it is taller since U6, and on Android the panel's top edge alone came into
# view with its rows still below the fold.
- scrollUntilVisible:
    element:
      id: student-tutors
    direction: DOWN
    centerElement: true
- assertVisible: 'Alex Chen'
- scrollUntilVisible:
    element:
      id: student-sessions-action
    direction: DOWN
- assertVisible: 'Your sessions'
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
- assertNotVisible: 'You pay'
- takeScreenshot: student-bottom
