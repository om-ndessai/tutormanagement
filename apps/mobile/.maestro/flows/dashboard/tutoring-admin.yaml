# The admin's dashboard, Tutoring tab (Priya, admin + tutor in chmi: the admin view is the
# default). Four sections in order, the sessions carousel, and no money anywhere on the tab --
# then the Finance tab and back.
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# UI upgrades U6: a greeting on the organization's clock, Today, then the figures above the tabs.
- assertVisible:
    id: home-greeting
    text: 'Good (morning|afternoon|evening), Priya'
- assertVisible:
    id: home-today
- extendedWaitUntil:
    visible:
      id: home-figures
    timeout: 20000
- assertVisible:
    id: tabs-tutoring
- assertVisible:
    id: stat-students
- assertVisible:
    id: stat-tutors
- assertVisible:
    id: stat-parents
- assertVisible:
    id: stat-sessions-running
- assertVisible:
    id: dashboard-section-tutoring-sessions
- extendedWaitUntil:
    visible:
      id: carousel-now
    timeout: 15000
- takeScreenshot: dashboard-admin-top
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
- scrollUntilVisible:
    element:
      id: dashboard-section-progress
    direction: DOWN
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: progress-spotlight-card
    direction: DOWN
- takeScreenshot: dashboard-admin-progress
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
- scrollUntilVisible:
    element:
      id: dashboard-section-recent-activity
    direction: DOWN
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: dashboard-section-recent-activity-action
    direction: DOWN
- takeScreenshot: dashboard-admin-activity
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
# The Finance half is its own tab.
- scrollUntilVisible:
    element:
      id: tabs-finance
    direction: UP
- tapOn:
    id: tabs-finance
- extendedWaitUntil:
    visible:
      id: dashboard-finance-admin
    timeout: 10000
# The figures (counts only) stay above both tabs; the Tutoring sections do not.
- assertVisible:
    id: home-figures
- assertNotVisible:
    id: dashboard-section-tutoring-sessions
- tapOn:
    id: tabs-tutoring
- extendedWaitUntil:
    visible:
      id: dashboard-section-tutoring-sessions
    timeout: 10000
