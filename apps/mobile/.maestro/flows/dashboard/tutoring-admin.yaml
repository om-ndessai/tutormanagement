# The admin's dashboard, Tutoring tab (Priya, admin + tutor in chmi: the admin view is the
# default). Its sections in order, the sessions carousel, and no money anywhere on the tab -- then
# the Finance tab and back. Phase 43 (the owner, 2026-10-20): no Analytics and no Recent Activity on
# Home; the figures are on More → Dashboard, checked at the end.
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# UI upgrades U6: a greeting on the organization's clock and Today above the tabs. Phase 43: she also
# tutors, so her Now card may greet her instead of the heading (never both).
- extendedWaitUntil:
    visible:
      id: '(tabs-tutoring|dashboard-parent|dashboard-student)'
    timeout: 20000
- assertVisible: 'Good (morning|afternoon|evening), Priya'
- assertVisible:
    id: home-today
- assertVisible:
    id: tabs-tutoring
- assertNotVisible:
    id: home-figures
- scrollUntilVisible:
    element:
      id: dashboard-section-tutoring-sessions
    direction: DOWN
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: carousel-now
    direction: DOWN
    timeout: 15000
- takeScreenshot: dashboard-admin-top
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
- scrollUntilVisible:
    element:
      id: dashboard-section-progress
    direction: DOWN
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: progress-spotlight-card
    direction: DOWN
- takeScreenshot: dashboard-admin-progress
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
# Recent Activity left Home (Phase 43): nothing follows Progress.
- scroll
- assertNotVisible:
    id: dashboard-section-recent-activity
- takeScreenshot: dashboard-admin-bottom
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
# The Finance half is its own tab.
- scrollUntilVisible:
    element:
      id: tabs-finance
    direction: UP
- tapOn:
    id: tabs-finance
- extendedWaitUntil:
    visible:
      id: dashboard-finance-admin
    timeout: 10000
# The Tutoring sections stay on their tab; no figures on Finance's Home either.
- assertNotVisible:
    id: home-figures
- assertNotVisible:
    id: dashboard-section-tutoring-sessions
- tapOn:
    id: tabs-tutoring
# Phase 43: the Now card and the brief lead the Tutoring tab of anyone who tutors.
- scrollUntilVisible:
    element:
      id: dashboard-section-tutoring-sessions
    direction: DOWN
    visibilityPercentage: 1
    timeout: 15000
# The figures (counts only) are on More → Dashboard (Phase 43).
- tapOn:
    id: tab-more
- extendedWaitUntil:
    visible:
      id: screen-more
    timeout: 10000
- tapOn:
    id: more-nav-analytics
- extendedWaitUntil:
    visible:
      id: stat-students
    timeout: 20000
- assertVisible:
    id: stat-tutors
- assertVisible:
    id: stat-parents
- assertVisible:
    id: stat-sessions-running
- assertNotVisible: '.*\$[0-9].*'
