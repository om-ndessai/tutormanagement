# The admin's dashboard, Tutoring tab (Priya, admin + tutor in chmi: the admin view is the
# default). Its sections in order, the sessions carousel, and no money anywhere on the tab -- then
# the Finance tab and back. Phase 43 (the owner, 2026-10-20): no Analytics and no Recent Activity on
# Home. Phase 66: the whole dashboard is More → Dashboard -- Analytics first, Recent Activity last.
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
# UI upgrades U6: a greeting on the organization's clock and Today above the tabs. Phase 43: she also
# tutors, so her Now card may greet her instead of the heading (never both).
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 20000
# Phase 66: the role dashboards are More → Dashboard.
# Phase 74 (JF24): the page opens on the hat Home leads with, which may be her teaching today; this is the office's.
- runFlow:
    file: ../../subflows/open-dashboard.yaml
    env:
      ROLE: admin
- extendedWaitUntil:
    visible:
      id: '(tabs-tutoring|dashboard-parent|dashboard-student)'
    timeout: 20000
- assertVisible:
    id: home-today
- assertVisible:
    id: tabs-tutoring
- assertVisible:
    id: stat-students
- assertVisible:
    id: stat-tutors
- assertVisible:
    id: stat-parents
- assertVisible:
    id: stat-sessions-running
- scrollUntilVisible:
    element:
      id: dashboard-section-tutoring-sessions
    direction: DOWN
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: carousel-now
    direction: DOWN
    timeout: 15000
- takeScreenshot: dashboard-admin-top
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
- scrollUntilVisible:
    element:
      id: dashboard-section-progress
    direction: DOWN
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: progress-spotlight-card
    direction: DOWN
- takeScreenshot: dashboard-admin-progress
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
# Recent Activity closes the page (as the web's dashboard).
- scrollUntilVisible:
    element:
      id: dashboard-section-recent-activity
    direction: DOWN
    visibilityPercentage: 1
- takeScreenshot: dashboard-admin-bottom
- assertNotVisible:
    id: session-money
- assertNotVisible: '.*\$[0-9].*'
# The Finance half is its own tab.
- scrollUntilVisible:
    element:
      id: tabs-finance
    direction: UP
- tapOn:
    id: tabs-finance
- extendedWaitUntil:
    visible:
      id: dashboard-finance-admin
    timeout: 10000
# The Tutoring sections stay on their tab.
- assertNotVisible:
    id: dashboard-section-tutoring-sessions
- tapOn:
    id: tabs-tutoring
- scrollUntilVisible:
    element:
      id: dashboard-section-tutoring-sessions
    direction: DOWN
    visibilityPercentage: 1
- assertNotVisible: '.*\$[0-9].*'
