# Someone with two roles (Maria: tutor and Sofia's parent) lands on her tutor dashboard, as on the
# web, and switches to her parent dashboard and back. Since Phase 66 the dashboards are More →
# Dashboard, with the role chips on the page. Not an admin: no "view as".
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: maria.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
# Phase 66: Home is the member home -- no role chips there, nor in the account sheet. The role
# dashboards are More → Dashboard, with her roles as chips on the page (as the web's role picker).
- assertVisible: 'Good (morning|afternoon|evening), Maria'
- assertNotVisible:
    id: dashboard-role-tutor
- assertNotVisible:
    id: dashboard-view-as
- runFlow: ../../subflows/open-dashboard.yaml
- extendedWaitUntil:
    visible:
      id: dashboard-role-tutor
    timeout: 15000
- assertVisible:
    id: dashboard-role-parent
- assertNotVisible:
    id: dashboard-view-as
- assertNotVisible:
    id: view-as-banner
- extendedWaitUntil:
    visible:
      id: tabs-tutoring
    timeout: 15000
- takeScreenshot: role-tutor
- tapOn:
    id: dashboard-role-parent
- extendedWaitUntil:
    visible:
      id: dashboard-parent
    timeout: 15000
- assertNotVisible:
    id: tabs-finance
# Her child's card: Sofia, with no tutor's pay anywhere.
- assertVisible:
    id: home-child-00000000-0000-4000-8000-000000000008
- assertNotVisible: 'Your pay'
- takeScreenshot: role-parent
- scrollUntilVisible:
    element:
      id: progress-card-00000000-0000-4000-8000-000000000008
    direction: DOWN
    timeout: 30000
- assertVisible: "Sofia Okafor's progress"
- scrollUntilVisible:
    element:
      id: dashboard-role-tutor
    direction: UP
    timeout: 30000
- tapOn:
    id: dashboard-role-tutor
- extendedWaitUntil:
    visible:
      id: dashboard-section-tutoring-sessions
    timeout: 15000
- assertNotVisible:
    id: dashboard-parent
