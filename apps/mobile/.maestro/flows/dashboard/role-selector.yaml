# Someone with two roles (Maria: tutor and Sofia's parent) switches between her dashboards on More → Dashboard
# (Phase 66), the role chips on the page. Not an admin: no "view as".
# Phase 74 (JF24, owner 2026-11-05): the Dashboard opens on the hat her home leads with -- she teaches nobody, so her
# home is her child's and the Dashboard opens on Parent (no longer an empty Tutor view) -- and the switch is labelled
# "Viewing as". A choice is remembered for this space on this phone: back on the page later, it opens on Tutor.
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: maria.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
# Phase 66: Home is the member home -- no role chips there, nor in the account sheet.
- assertVisible: 'Good (morning|afternoon|evening), Maria'
- assertNotVisible:
    id: dashboard-role-tutor
- assertNotVisible:
    id: dashboard-view-as
- scrollUntilVisible:
    element:
      id: home-section-parent
    visibilityPercentage: 1
- runFlow: ../../subflows/open-dashboard.yaml
# Her home leads with her child, so the Dashboard opens on Parent.
- extendedWaitUntil:
    visible:
      id: dashboard-parent
    timeout: 15000
- assertVisible:
    id: dashboard-role-label
    text: 'Viewing as'
- assertVisible:
    id: dashboard-role-parent
- assertVisible:
    id: dashboard-role-tutor
- assertNotVisible:
    id: tabs-finance
- assertNotVisible:
    id: dashboard-view-as
- assertNotVisible:
    id: view-as-banner
- assertNotVisible:
    id: tabs-tutoring
# Her child's card: Sofia, with no tutor's pay anywhere.
- assertVisible:
    id: home-child-00000000-0000-4000-8000-000000000008
- assertNotVisible: 'Your pay'
- assertNotVisible: '.*portal.*'
- takeScreenshot: role-parent
- scrollUntilVisible:
    element:
      id: progress-card-00000000-0000-4000-8000-000000000008
    direction: DOWN
    timeout: 30000
- assertVisible: "Sofia Okafor's progress"
- scrollUntilVisible:
    element:
      id: dashboard-role-tutor
    direction: UP
    timeout: 30000
# Her tutor dashboard, chosen: remembered for this space.
- tapOn:
    id: dashboard-role-tutor
- extendedWaitUntil:
    visible:
      id: tabs-tutoring
    timeout: 15000
- assertNotVisible:
    id: dashboard-parent
- takeScreenshot: role-tutor
# Away and back: the app closed and opened again (its memory kept), the page opens on her last choice here.
- launchApp:
    stopApp: true
    clearState: false
- runFlow:
    when:
      true: ${APP_ID.endsWith('.dev')}
    file: ../../subflows/dev-client-load.yaml
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
- runFlow: ../../subflows/open-dashboard.yaml
- extendedWaitUntil:
    visible:
      id: dashboard-section-tutoring-sessions
    timeout: 15000
- assertNotVisible:
    id: dashboard-parent
# And back to Parent, which is remembered in its turn.
- tapOn:
    id: dashboard-role-parent
- extendedWaitUntil:
    visible:
      id: dashboard-parent
    timeout: 15000
