# Someone with two roles (Maria: tutor and Sofia's parent) lands on her tutor dashboard, as on the
# web, and switches to her parent dashboard and back. Since UI upgrades U6 the choice is in the
# account sheet ("Home shows"), not on Home. Not an admin: no "view as".
appId: ${APP_ID}
tags:
  - feature
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: maria.okafor@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: home-figures
    timeout: 30000
# Home opens on the greeting and Today: no role chips there.
- assertVisible:
    id: home-greeting
    text: 'Good (morning|afternoon|evening), Maria'
- assertNotVisible:
    id: dashboard-role-tutor
- assertNotVisible:
    id: dashboard-view-as
- assertNotVisible:
    id: view-as-banner
- takeScreenshot: role-tutor
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: account-home-role
    timeout: 10000
- assertVisible: 'Home shows'
- assertVisible:
    id: dashboard-role-tutor
- assertVisible:
    id: dashboard-role-parent
- takeScreenshot: role-account-sheet
# The sheet takes taps once it has risen (iOS).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: dashboard-role-parent
- extendedWaitUntil:
    visible:
      id: dashboard-parent
    timeout: 15000
- assertNotVisible:
    id: screen-account
- assertNotVisible:
    id: tabs-finance
# Her child's card: Sofia, with no tutor's pay anywhere.
- assertVisible:
    id: home-child-00000000-0000-4000-8000-000000000008
- assertNotVisible: 'Your pay'
- takeScreenshot: role-parent
- scrollUntilVisible:
    element:
      id: progress-card-00000000-0000-4000-8000-000000000008
    direction: DOWN
    timeout: 30000
- assertVisible: "Sofia Okafor's progress"
- scrollUntilVisible:
    element:
      id: account-button
    direction: UP
    timeout: 30000
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: dashboard-role-tutor
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: dashboard-role-tutor
- extendedWaitUntil:
    visible:
      id: dashboard-section-tutoring-sessions
    timeout: 15000
- assertNotVisible:
    id: dashboard-parent
