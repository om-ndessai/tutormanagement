# R14: an organization's admin is nobody in the console. Priya (admin of chmi): a deep link to
# /platform -- or to its question bank or Review (#54), or the Handwriting lab (#64) -- lands her back
# in her organization, and the account sheet offers no way in.
appId: ${APP_ID}
tags:
  - exposure
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: priya.raghavan@gmail.com
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 20000
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://platform'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertNotVisible:
    id: screen-platform
- assertNotVisible: 'New space'
# The question bank (#54): its tab and its Review, by link, land on Home too.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://platform/questions'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertNotVisible:
    id: screen-platform-questions
- assertNotVisible: 'Review [0-9]+ checked'
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://question-review'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertNotVisible:
    id: screen-question-review
- assertNotVisible:
    id: question-bank-approve
# The Handwriting lab (Phase 54, #64): adults' handwriting, platform admins only.
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: 'aimtrue://handwriting-lab'
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertNotVisible:
    id: screen-handwriting-lab
- assertNotVisible:
    id: lab-canvas
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- scrollUntilVisible:
    element:
      id: account-sign-out
- assertNotVisible:
    id: account-platform
- assertNotVisible: 'Platform console'
