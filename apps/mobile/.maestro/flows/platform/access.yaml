# Phase 65 (docs/access-approval-plan.md, A4, A6, A7): who may sign up. Nav (a platform admin) opens the
# console's Settings and, under Guest play's Sign-up access, chooses Post-approved. A newcomer then plays
# G4Q5 as a guest and signs up from the offer's sign-up sheet (with sign-in off, the developer path) and,
# instead of the "You're in." splash, meets the plain refusal screen: "Waiting for approval", saying play
# goes on without an account, with Keep playing first and Contact us with the address in full (Phase 70,
# UI audit JF2); the sign-up sheet said the wait before the address (signup-access-note). Keep playing
# closes the sign-up sheet: the same question of the same quest (JF36, J01A
# step 14); Exit is then the guest home. Nav, signed in again, sees the gear's count, finds them under
# Waiting for approval and approves them; they move to Recently decided. The newcomer can then sign in,
# into their own space.
# Phase 80 (docs/members-plan.md, A10-A12, A15): the Post-approved sign-up made no space (the console's people lookup
# counts none while they wait). Approve opens the approve sheet: Nowhere by default; Nav searches "Chapel" and places
# Pia in Chapel Hill Math Institute (made in the console) as a Member -- Admin is offered there, for an adult -- and the
# sheet says she joins at once. Recently decided reads "Joined Chapel Hill Math Institute". Pia then signs in into CHMI
# as a member, offered a space of her own on Home (the offer itself is home/personal-offer's subject).
# Self-cleaning, before and after: the mode back to Open, the newcomer approved (so it may be deleted)
# and deleted with its personal space, and guest play off.
appId: ${APP_ID}
tags:
  - feature
onFlowStart:
  - runScript:
      file: ../../scripts/access.js
      env: { ACTION: reset, EMAIL: access.pending@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: access.pending@example.com }
  - runScript:
      file: ../../scripts/guest-play.js
      env: { ACTION: 'off' }
onFlowComplete:
  - runScript:
      file: ../../scripts/access.js
      env: { ACTION: reset, EMAIL: access.pending@example.com }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: reset-newcomer, EMAIL: access.pending@example.com }
  - runScript:
      file: ../../scripts/guest-play.js
      env: { ACTION: 'off' }
---
# 1. The platform admin chooses Post-approved.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: ndessai@gmail.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: screen-platform
    timeout: 20000
- tapOn:
    id: platform-settings
- extendedWaitUntil:
    visible:
      id: screen-platform-settings
    timeout: 10000
# The row at the top of Settings jumps past the tiles to Sign-up access.
- extendedWaitUntil:
    visible:
      id: access-jump-review
    timeout: 10000
- assertVisible: 'Sign-up access: Open'
- tapOn:
    id: access-jump-review
- scrollUntilVisible:
    element:
      id: access-mode-postapproved
    centerElement: true
    timeout: 20000
- assertVisible:
    id: access-mode-description
    text: 'Anyone may sign up.'
- tapOn:
    id: access-mode-postapproved
- extendedWaitUntil:
    visible:
      id: access-mode-description
      text: 'Anyone may sign up, then waits until a platform admin approves them.'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: access-waiting-empty
    centerElement: true
- takeScreenshot: access-console-postapproved

# 2. A newcomer plays as a guest, signs up from the offer after question 1, and waits.
- runScript:
    file: ../../scripts/guest-play.js
    env: { ACTION: 'on' }
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: screen-guest-home
    timeout: 30000
# The tiles sit under the grade chips: on a shorter phone below the fold.
- scrollUntilVisible:
    element:
      id: guest-tile-G4Q5
    direction: DOWN
- tapOn:
    id: guest-tile-G4Q5
- extendedWaitUntil:
    visible:
      id: guest-question
    timeout: 15000
- runFlow:
    file: ../../subflows/guest-skip.yaml
    env:
      NEXT: 'nudge'
- tapOn:
    id: guest-nudge-signup
- extendedWaitUntil:
    visible:
      id: signup-sheet
    timeout: 10000
# Phase 70 (UI audit JF2, JF8): the wait is said before the address, not after the form.
- assertVisible:
    id: signup-access-note
- assertVisible: '.*checks every new account before you can sign in, usually within a day.*'
- tapOn:
    id: signup-sheet-email
- inputText: 'access.pending@example.com'
- tapOn:
    id: signup-sheet-continue
- extendedWaitUntil:
    visible:
      id: screen-sign-up
    timeout: 10000
- tapOn:
    id: signup-dev-name
- inputText: 'Pia Pending'
# The return key puts the keyboard away (guest-signup.yaml: hideKeyboard on iOS taps the Terms link).
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: signup-month
- tapOn:
    id: signup-month-6
- tapOn:
    id: signup-year
- tapOn:
    id: signup-year-search
- inputText: '1990'
- tapOn:
    id: signup-year-1990
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      id: signup-accept
- tapOn:
    id: signup-accept
- runFlow:
    when:
      notVisible:
        id: signup-submit
        enabled: true
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          id: signup-accept
- scrollUntilVisible:
    element:
      id: signup-submit
- tapOn:
    id: signup-submit
# Not the splash: the refusal screen, in the server's words.
- extendedWaitUntil:
    visible:
      id: screen-access-refused
    timeout: 15000
- assertVisible:
    id: access-refused-title
    text: 'Waiting for approval'
- assertVisible:
    id: access-refused-message
    text: 'Thanks, Pia. A person at Aimtrue checks every new account, usually within a day.*'
- assertNotVisible:
    id: signup-splash
- assertVisible:
    id: access-refused-keep-line
    text: 'You can keep playing without an account.'
- assertVisible:
    id: access-refused-keep-playing
    text: '.*Keep playing'
- assertNotVisible:
    id: access-refused-back
- scrollUntilVisible:
    element:
      id: access-refused-contact
- assertVisible:
    id: access-refused-contact
    text: '.*Contact us: .+@.+'
- takeScreenshot: access-refused-pending
- scrollUntilVisible:
    element:
      id: access-refused-keep-playing
    direction: UP
- tapOn:
    id: access-refused-keep-playing
# Back where they were: question 2 of the same quest, not the guest home (J01A step 14).
- extendedWaitUntil:
    visible:
      id: guest-progress
      text: '2 of 5'
    timeout: 15000
- assertNotVisible:
    id: screen-access-refused
- takeScreenshot: access-refused-kept-playing
- tapOn:
    id: quest-exit
- extendedWaitUntil:
    visible:
      id: screen-guest-home
    timeout: 15000
# Phase 80 (A10): under Post-approved, signing up made no space at all.
- runScript:
    file: ../../scripts/access.js
    env: { ACTION: count, EMAIL: access.pending@example.com }
- assertTrue: ${output.access.spaces === 0}

# 3. The platform admin approves them, placing them in CHMI (Phase 80, A11, A15).
- runScript:
    file: ../../scripts/guest-play.js
    env: { ACTION: 'off' }
- runScript:
    file: ../../scripts/access.js
    env: { ACTION: find, EMAIL: access.pending@example.com }
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: ndessai@gmail.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: screen-platform
    timeout: 20000
# The gear counts who waits.
- assertVisible:
    id: platform-settings-waiting
    text: '1'
- tapOn:
    id: platform-settings
- extendedWaitUntil:
    visible:
      id: screen-platform-settings
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: access-jump-waiting
      text: '1 waiting for approval'
    timeout: 10000
- tapOn:
    id: access-jump-review
- scrollUntilVisible:
    element:
      id: access-waiting-${output.access.userId}
    centerElement: true
    timeout: 20000
- assertVisible: 'Pia Pending'
- assertVisible: 'access.pending@example.com'
- assertVisible: 'Adult · Developer sign-in · signed up .*'
- takeScreenshot: access-console-waiting
# Approve asks where to place them first: the sheet, on Nowhere.
- tapOn:
    id: access-approve-${output.access.userId}
- extendedWaitUntil:
    visible:
      id: access-approve-sheet
    timeout: 10000
- assertVisible:
    id: access-approve-title
    text: 'Approve Pia Pending'
- assertVisible: 'access.pending@example.com · Adult'
- assertVisible:
    id: access-approve-place-label
    text: 'Place them in a space \(optional\)'
- assertVisible:
    id: access-approve-row-nowhere
- assertNotVisible:
    id: access-approve-place
# CHMI, found by name (seeded: 0a000000-0000-4000-8000-000000000001, made in the console; its Question Quest switch is
# off in the seed, so the sheet warns -- quest-start.js turns it on only for the quest flows).
- tapOn:
    id: access-approve-input
- inputText: 'Chapel'
- extendedWaitUntil:
    visible:
      id: access-approve-row-0a000000-0000-4000-8000-000000000001
    timeout: 15000
# The row is tapped with the keyboard up; choosing puts it away, so the role and Approve show.
- tapOn:
    id: access-approve-row-0a000000-0000-4000-8000-000000000001
- extendedWaitUntil:
    visible:
      id: access-approve-words
      text: 'Pia joins Chapel Hill Math Institute at once, and lands there when they sign in\.'
    timeout: 10000
# A console-made space and an adult: Member (chosen) or Admin. Quest is off there: the warning (PLACEMENT_QUEST_OFF).
- assertVisible:
    id: access-approve-role-member
- assertVisible:
    id: access-approve-role-admin
- assertVisible:
    id: access-approve-role-hint
    text: 'Plays Quest there, with no role until its admins give one\.'
- assertVisible:
    id: access-approve-quest-off
- assertVisible: "Quest is off there, so a member has nothing to do until the space's admins give them a role\\."
- takeScreenshot: access-approve-sheet
- tapOn:
    id: access-approve-confirm
- extendedWaitUntil:
    notVisible:
      id: access-approve-sheet
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: access-decided-${output.access.userId}
    timeout: 10000
- scrollUntilVisible:
    element:
      id: access-revoke-${output.access.userId}
    centerElement: true
- assertVisible: 'Approved by Nav Dessai.*'
- assertVisible:
    id: access-placed-${output.access.userId}
    text: 'Joined Chapel Hill Math Institute'
- assertNotVisible:
    id: access-waiting-${output.access.userId}
- takeScreenshot: access-console-approved

# 4. Approved: they sign in, into CHMI, where they were placed (A13) -- a member, offered a space of their own.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: access.pending@example.com
      ORG: ''
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 30000
- assertNotVisible:
    id: screen-access-refused
- extendedWaitUntil:
    visible:
      id: home-personal-offer
    timeout: 15000
- assertVisible:
    id: home-personal-offer-text
    text: 'You''re in Chapel Hill Math Institute\..*'
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- assertVisible:
    id: account-roles
    text: 'Member at CHMI'
- takeScreenshot: access-placed-home
