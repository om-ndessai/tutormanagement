# A tutor takes the tour from the account menu (Alex): the wizard, Take the tour, then Home
# dimmed with one part lit and a card ("1 of N") -- since Phase 66 the home's own blocks first (the
# band, Next up, To record), then Dashboard under More and the menu; Back and Next move between steps, and
# Finish brings the wizard back on confirming his details (a non-admin's last step). Schedule's
# step lights Lessons (the `sessions` tab, Phase 78's word), where Schedule lives now. Closing it
# changes nothing: he had been through it already.
# Phase 74 (JF25, owner 2026-11-05): the tour is offered once per PERSON, the server's record deciding -- Alex on a
# fresh device is offered nothing. The one offer left, a first visit to a space by somebody who has been through it
# (Tessa, just added to chmi), is a card at the top of the home, in the page's flow (the band and Next up stay in
# view, nothing covered), "A quick tour"; No thanks puts it away, and her next sign-in -- a fresh device too -- offers
# nothing. Self-cleaning (clean-people.js removes Tessa).
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/clean-people.js
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: add-person, EMAIL: tour.visitor@example.com, NAME: Tessa Visitor, ROLES: parent, ACTOR: priya.raghavan@gmail.com, ORG: chmi, STATUS: active }
  - runScript:
      file: ../../scripts/spaces.js
      env: { ACTION: tour-done, EMAIL: tour.visitor@example.com, ORG: chmi }
onFlowComplete:
  - runScript: ../../scripts/clean-people.js
tags:
  - feature
---
# --- The first visit's offer, inline, once --------------------------------------------------------------------------
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: tour.visitor@example.com
      ORG: chmi
      FRESH: '1'
- extendedWaitUntil:
    visible:
      id: tour-offer
    timeout: 30000
- assertVisible:
    id: tour-offer-title
    text: 'Welcome to .+'
- assertVisible: 'A quick tour of what is where\.'
- assertNotVisible: '.*portal.*'
# In the page's flow: the band and Next up are still there to read and tap.
- assertVisible:
    id: home-band
- assertVisible:
    id: next-up
- assertNotVisible:
    id: screen-onboarding
- takeScreenshot: tour-offer-inline
- tapOn:
    id: tour-offer-dismiss
- assertNotVisible:
    id: tour-offer
# Her next sign-in, on a fresh device: nothing (no first visit any more, and the device never decides).
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: tour.visitor@example.com
      ORG: chmi
      FRESH: '1'
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: tour-offer
- assertNotVisible:
    id: screen-onboarding

# --- Once per person: Alex on a fresh device is offered nothing; the account menu still opens it --------------------
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: alex.chen.math@gmail.com
      ORG: chmi
      FRESH: '1'
- extendedWaitUntil:
    visible:
      id: home-band
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: tour-offer
- assertNotVisible:
    id: screen-onboarding
- tapOn:
    id: account-button
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 10000
- scrollUntilVisible:
    element:
      id: account-tour
    direction: DOWN
    centerElement: true
- tapOn:
    id: account-tour
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 15000
- assertNotVisible:
    id: onboarding-choice-student
- assertVisible:
    id: onboarding-confirm-mine
- tapOn:
    id: onboarding-choice-tour
- extendedWaitUntil:
    visible:
      id: tour-card
    timeout: 15000
- assertVisible: '1 of .*'
- assertVisible: 'Your teaching at a glance'
- takeScreenshot: tour-step-1
- tapOn:
    id: tour-next
- extendedWaitUntil:
    visible:
      id: tour-title
      text: 'Next up'
    timeout: 5000
- assertVisible: '2 of .*'
- tapOn:
    id: tour-back
- extendedWaitUntil:
    visible: 'Your teaching at a glance'
    timeout: 5000
- tapOn:
    id: tour-next
- tapOn:
    id: tour-next
- takeScreenshot: tour-step-3
# Phase 66: the dashboard moved off Home to More → Dashboard; its step lights More and says so.
- repeat:
    times: 6
    while:
      notVisible:
        id: tour-title
        text: 'Dashboard'
    commands:
      - tapOn:
          id: tour-next
- assertVisible:
    id: tour-title
    text: 'Dashboard'
- assertVisible: '.*You will find it under More\..*'
# Schedule is inside Lessons (the tab bar, revised 2026-10-15; the tab's word since Phase 78): its step lights the
# Lessons tab and says where to find it.
- repeat:
    times: 12
    while:
      notVisible: '.*You will find it under Lessons\..*'
    commands:
      - tapOn:
          id: tour-next
- assertVisible:
    id: tour-title
    text: 'Schedule'
- takeScreenshot: tour-schedule-step
# On through the menu to the end.
- repeat:
    while:
      visible:
        id: tour-next
    commands:
      - tapOn:
          id: tour-next
- assertVisible: 'Your profile'
- assertVisible: '.*You will find it under More.'
- takeScreenshot: tour-last-step
- tapOn:
    id: tour-finish
- extendedWaitUntil:
    visible:
      id: screen-onboarding-confirm
    timeout: 15000
- assertVisible: 'Confirm your details'
- tapOn:
    id: onboarding-close
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertNotVisible:
    id: tour
