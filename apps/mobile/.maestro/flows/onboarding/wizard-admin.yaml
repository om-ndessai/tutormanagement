# A new admin meets the welcome wizard (Wren, added by the office, never signed in; a fresh device):
# it opens by itself; Add a student walks the family and the student (the Add a student flow, a new
# parent added inside it), the assessment, the plan and the pairing, each in the app's own sheet; done says the student is set up. Closed, it is through: a
# fresh device after that only offers the tour. Self-cleaning.
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../scripts/clean-people.js
  - runScript: ../../scripts/seed-onboarding.js
onFlowComplete:
  - runScript: ../../scripts/clean-people.js
tags:
  - feature
---
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: wren.calloway@example.com
      ORG: chmi
      FRESH: '1'
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 30000
- assertVisible: 'Welcome to .*, Wren'
- assertVisible:
    id: onboarding-choice-student
- takeScreenshot: onboarding-welcome-admin
- tapOn:
    id: onboarding-choice-student
- extendedWaitUntil:
    visible:
      id: student-flow-student
    timeout: 10000
- takeScreenshot: onboarding-student-step

# The family and the student: the Add a student flow (U3), a new parent added inside it.
- tapOn:
    id: student-flow-add-student
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who is their family\?.*'
    timeout: 15000
- tapOn:
    id: add-student-new-parent
- extendedWaitUntil:
    visible:
      id: new-parent
    timeout: 15000
- tapOn:
    id: new-parent-name
- inputText: 'Hollis Brandt'
- tapOn:
    id: new-parent-email
- inputText: 'hollis.brandt@example.com'
# The title puts the keyboard away (never hideKeyboard in an iOS form sheet), and the fitted sheet
# settles before its action is tapped.
- tapOn: 'They sign in with this Google address.*'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: new-parent-save
- extendedWaitUntil:
    notVisible:
      id: new-parent
    timeout: 15000
- extendedWaitUntil:
    visible: 'Remove Hollis Brandt'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Who is the student\?.*'
    timeout: 5000
- tapOn:
    id: add-student-name
- inputText: 'Juniper Brandt'
- hideKeyboard
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*School and goal.*'
    timeout: 5000
- tapOn:
    id: add-student-goal
- inputText: 'Ready for pre-algebra.'
- hideKeyboard
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*When can they learn\?.*'
    timeout: 5000
- tapOn:
    id: step-flow-skip
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*Their lessons.*'
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*The price.*'
    timeout: 5000
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-review
    timeout: 5000
- assertVisible: 'Hollis Brandt — Guardian'
- tapOn:
    id: step-flow-next

# Where she stands.
- extendedWaitUntil:
    visible:
      id: student-flow-assessment
    timeout: 15000
- assertVisible: 'Where Juniper Brandt stands'
- tapOn:
    id: student-flow-assess
- extendedWaitUntil:
    visible:
      id: assessment-summary
    timeout: 15000
- tapOn:
    id: assessment-summary
- inputText: 'Solid arithmetic; ready to move on.'
- tapOn: 'Assess Juniper Brandt'
- scrollUntilVisible:
    element:
      id: assessment-save
    direction: DOWN
    centerElement: false
- tapOn:
    id: assessment-save

# Her plan, from her goal.
- extendedWaitUntil:
    visible:
      id: student-flow-plan-step
    timeout: 15000
- assertVisible:
    id: flow-step-assessment
- tapOn:
    id: student-flow-plan
- extendedWaitUntil:
    visible:
      id: screen-plan-form
    timeout: 15000
- assertVisible: 'Ready for pre-algebra.'
- scrollUntilVisible:
    element:
      id: plan-save
    direction: DOWN
    centerElement: false
- tapOn:
    id: plan-save

# A tutor: the pairing sheet, with her already chosen.
- extendedWaitUntil:
    visible:
      id: student-flow-pairing
    timeout: 15000
- tapOn:
    id: student-flow-pair
- extendedWaitUntil:
    visible:
      id: assignment-tutor
    timeout: 15000
- assertVisible: '.*Juniper Brandt.*'
- tapOn:
    id: assignment-tutor-00000000-0000-4000-8000-000000000003
- scrollUntilVisible:
    element:
      id: assignment-save
    direction: DOWN
    centerElement: false
- tapOn:
    id: assignment-save

- extendedWaitUntil:
    visible:
      id: student-flow-done
    timeout: 15000
- assertVisible: 'Juniper Brandt is set up'
- takeScreenshot: onboarding-student-done
# The pairing sheet has only just gone: a tap on Close while the header is still settling can be
# lost (as a Back can, in people/tutor-view); press it again.
- waitForAnimationToEnd:
    timeout: 3000
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: onboarding-close
      - extendedWaitUntil:
          visible:
            id: screen-home
          timeout: 8000
- assertNotVisible:
    id: screen-onboarding

# Through it now: another fresh device only offers the tour.
- runFlow:
    file: ../../subflows/sign-in-as.yaml
    env:
      PERSONA: wren.calloway@example.com
      ORG: chmi
      FRESH: '1'
- extendedWaitUntil:
    visible:
      id: tour-offer
    timeout: 30000
- assertNotVisible:
    id: screen-onboarding
- tapOn:
    id: tour-offer-dismiss
- assertNotVisible:
    id: tour-offer
