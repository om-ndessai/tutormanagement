# Every Tutoring surface one person reaches, with no money on any of them (Phase 19; R1-R3): the
# Home Tutoring tab (or a student's dashboard, which has no money at all), the Sessions Tutoring tab,
# a lesson's detail opened from it, and -- for whoever may record -- the record sheet opened from it.
# A parent's Home is the family's own money and no Tutoring surface, so it is left to
# finance-side.yaml.
#
# env: PERSONA (email), NAME (for screenshots), LESSON (a lesson id they can see), RECORD ('yes' if they may record).
appId: ${APP_ID}
---
- runFlow:
    file: ../sign-in-as.yaml
    env:
      PERSONA: ${PERSONA}
      ORG: chmi
- extendedWaitUntil:
    visible:
      id: 'dashboard-(section-analytics|student|parent)'
    timeout: 30000
# Home, Tutoring (the default for a tutor or admin), and a student's dashboard.
- runFlow:
    when:
      notVisible:
        id: dashboard-parent
    commands:
      - assertNotVisible:
          id: 'dashboard-finance-.*'
      - runFlow: no-money-scrolling.yaml
- takeScreenshot: exposure-home-${NAME}
# Sessions, Tutoring: no totals, no export, no money on a card however far down.
# By its link: a tap on "Sessions" can land on Home's Sessions tile instead of the tab.
- runFlow:
    file: ../open-link.yaml
    env:
      LINK: aimtrue://sessions
- extendedWaitUntil:
    visible:
      id: tabs-tutoring
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'session-card-.*'
      index: 0
    timeout: 20000
- assertNotVisible:
    id: sessions-export
- assertNotVisible:
    id: 'stat-(earned|charged)'
- runFlow: no-money-scrolling.yaml
- takeScreenshot: exposure-sessions-${NAME}
# Recording is a tutor's or the office's; nobody else is offered it.
- runFlow:
    when:
      true: ${RECORD != 'yes'}
    commands:
      # The create button (UI upgrades U2) is the reader's own actions: none here, so none at all.
      - assertNotVisible:
          id: create-button
      - assertNotVisible:
          id: sessions-record-button
      - assertNotVisible:
          id: sessions-start
# One lesson's detail, opened from Tutoring: write-up and assessments, no money.
- runFlow:
    file: ../open-link.yaml
    env:
      LINK: aimtrue://sessions?focus=${LESSON}&tab=tutoring
- extendedWaitUntil:
    visible:
      id: session-preview-${LESSON}
    timeout: 20000
- runFlow: no-money.yaml
- tapOn:
    id: session-preview-${LESSON}
- extendedWaitUntil:
    visible:
      id: session-notes
    timeout: 15000
- assertVisible:
    id: screen-session
- runFlow: no-money-scrolling.yaml
- takeScreenshot: exposure-lesson-${NAME}
- retry:
    maxRetries: 1
    commands:
      - runFlow: ../go-back.yaml
      - extendedWaitUntil:
          visible:
            id: screen-sessions
          timeout: 10000
# Recording from Tutoring: the length, never a figure, on the student and the When steps.
- runFlow:
    when:
      true: ${RECORD == 'yes'}
    commands:
      # Recording is the tab bar's create button (UI upgrades U2).
      - tapOn:
          id: create-button
      - tapOn:
          id: create-action-record-session
      # The record step flow (UI upgrades U4): its first two steps, where the pairings and the
      # length are -- the write-up cards carry no figures at all.
      - extendedWaitUntil:
          visible:
            id: step-flow-title
            text: '.*Who was the lesson with\?.*'
          timeout: 15000
      - runFlow: no-money.yaml
      - waitForAnimationToEnd:
          timeout: 3000
      # The first row on screen: anyone's pairing will do. A tutor with no student of their own here
      # (Maria teaches nobody in chmi) is told so on the first step, which has no figure either.
      - runFlow:
          when:
            visible:
              id: 'record-student-row-.*'
          commands:
            - tapOn:
                id: 'record-student-row-.*'
                index: 0
            - tapOn:
                id: step-flow-next
            - extendedWaitUntil:
                visible:
                  id: record-preview
                timeout: 15000
            - runFlow: no-money-scrolling.yaml
            - assertNotVisible:
                id: record-money
      - runFlow:
          when:
            visible: 'No students to record yet'
          commands:
            - runFlow: no-money-scrolling.yaml
      - takeScreenshot: exposure-record-${NAME}
      - tapOn:
          id: step-flow-close
      - extendedWaitUntil:
          visible:
            id: screen-sessions
          timeout: 15000
