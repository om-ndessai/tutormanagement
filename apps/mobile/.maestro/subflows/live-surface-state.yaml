# Whether the live lesson's system surface exists (#45), read from the system by the developer
# diagnostics screen (`diag-live-surface`: ActivityKit's running activities on iOS, the active
# notifications on Android) -- neither the Lock Screen nor the Dynamic Island is in the app's view
# hierarchy. Env STATE: `showing` or `none`. Comes back through the surface's own tap target, the
# Sessions tab (`aimtrue://sessions?tab=tutoring`), which the caller waits for.
appId: ${APP_ID}
---
- runFlow:
    file: open-link.yaml
    env:
      LINK: aimtrue://dev/diagnostics
- extendedWaitUntil:
    visible:
      id: diag-live-surface
      text: ${STATE}
    timeout: 15000
- runFlow:
    file: open-link.yaml
    env:
      LINK: aimtrue://sessions?tab=tutoring
- extendedWaitUntil:
    visible:
      id: screen-sessions
    timeout: 15000
