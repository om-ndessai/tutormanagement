# Record a lesson from the tab bar's create button (UI upgrades U4) up to the write-up's first card:
# Phase 75 (JF30): the create button's "Record a lesson" opens the lessons still owed, whose "Another lesson" is the
# step flow; the student (env PAIRING, their pairing's id) is chosen, the day and times -- blank, never today by
# default -- are chosen (today, 4:00-5:00 PM), and Planned is on screen. No money on the way: the flow is Tutoring's.
appId: ${APP_ID}
---
- tapOn:
    id: create-button
- tapOn:
    id: create-action-record-session
- extendedWaitUntil:
    visible:
      id: lessons-owed-another
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: lessons-owed-another
- extendedWaitUntil:
    visible:
      id: record-student-row-${PAIRING}
    timeout: 15000
# Taps during the rise are not delivered (iOS, U3).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: record-student-row-${PAIRING}
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*When was it\?.*'
    timeout: 10000
- runFlow: record-choose-when.yaml
- assertNotVisible: '.*\$[0-9].*'
- tapOn:
    id: step-flow-next
- extendedWaitUntil:
    visible:
      id: step-flow-title
      text: '.*What was planned\?.*'
    timeout: 10000
