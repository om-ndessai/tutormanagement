# Point a development build at Metro (localhost:8081; on Android via adb reverse). The dev
# launcher may not be ready for the first link, so it is retried while the launcher shows.
appId: ${APP_ID}
---
# A link opened before this flow began leaves iOS's "Open in …?" confirmation up (a fresh install
# gets one from the build itself, which opens the dev-client link), and while it is up the
# launcher underneath is invisible to the flow. Answer it first.
- extendedWaitUntil:
    visible: 'Open'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Development Build|DEVELOPMENT SERVERS|Development servers'
    timeout: 15000
    optional: true
- repeat:
    while:
      visible: 'Development Build|DEVELOPMENT SERVERS|Development servers'
    times: 4
    commands:
      - runFlow:
          file: open-link.yaml
          env:
            LINK: exp+aimtrue://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
      - extendedWaitUntil:
          notVisible: 'Development Build|DEVELOPMENT SERVERS|Development servers'
          timeout: 20000
          optional: true
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
# Android shows the dev menu again once the bundle loads; close it.
- extendedWaitUntil:
    visible: 'Toggle performance monitor'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - back
