# "Save as reviewed"'s confirm (Phase 40) is a native alert over a screen with its own "Save as
# reviewed": tap the alert's. Android's dialog draws its buttons in capitals.
# On iOS the alert's button is picked as the sibling of its "Keep reviewing" (the two share a parent). Picking it by
# position was not enough: with the screen scrolled to its top, the screen's own button sits behind the alert's
# message, so "below the message" (Maestro compares top edges) and "above Keep reviewing" both matched the screen's
# button first, and the tap landed on the alert's message.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: 'Save this as reviewed\?'
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Save as reviewed'
          childOf:
            containsChild:
              text: 'Keep reviewing'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'android:id/button1'
