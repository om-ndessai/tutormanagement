plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.livelessonnotification'
version = '1.0.0'

android {
  namespace "expo.modules.livelessonnotification"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // 1.17 brings NotificationCompat's setRequestPromotedOngoing (Android 16 Live Updates).
  implementation 'androidx.core:core-ktx:1.17.0'
}
